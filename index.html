<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Vault</title>
    
    <!-- PWA Manifest & Mobile Icons -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Watch Vault">
    <link rel="apple-touch-icon" href="icon-512.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12 font-sans antialiased">
    <div class="max-w-md mx-auto px-4 py-4 space-y-4">

        <!-- Top Header & Actions -->
        <header class="flex items-center justify-between bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-lg gap-2">
            <h1 class="text-base font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                Watch Vault
            </h1>
            
            <!-- Centered Circular Add Watch Pill -->
            <div class="flex flex-col items-center">
                <span class="text-[9px] font-bold uppercase tracking-wider text-slate-400 mb-1">Add Watch</span>
                <button onclick="openModal()" class="w-8 h-8 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-base rounded-full shadow-md active:scale-95 transition-all flex items-center justify-center">
                    +
                </button>
            </div>

            <!-- Collection Value Stack (Right Side) -->
            <div class="flex flex-col items-center text-center">
                <span class="block text-[9px] font-bold uppercase tracking-wider text-slate-500">Collection Value</span>
                <span id="headerCollectionVal" class="text-emerald-400 font-bold text-xs sm:text-sm">$0</span>
            </div>
        </header>

        <!-- Backup & Restore Bar -->
        <div class="grid grid-cols-2 gap-2">
            <button onclick="exportBackup()" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 font-medium text-xs py-2 rounded-xl text-center active:scale-95 transition-all">
                📥 Export Backup
            </button>
            <button onclick="document.getElementById('importFile').click()" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 font-medium text-xs py-2 rounded-xl text-center active:scale-95 transition-all">
                📤 Import Backup
            </button>
            <input type="file" id="importFile" accept=".json" class="hidden" onchange="importBackup(event)">
        </div>

        <!-- Horizontal Scroll Category Bar -->
        <div class="flex gap-2 overflow-x-auto no-scrollbar py-1" id="catFilters">
            <button onclick="setFilter('All', this)" class="filter-btn active bg-indigo-600 text-white text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-indigo-500 shadow-sm transition-all">All</button>
            <button onclick="setFilter('Diver', this)" class="filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all">Diver</button>
            <button onclick="setFilter('Dress', this)" class="filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all">Dress</button>
            <button onclick="setFilter('Chronograph', this)" class="filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all">Chronograph</button>
            <button onclick="setFilter('Field', this)" class="filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all">Field</button>
            <button onclick="setFilter('Vintage', this)" class="filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all">Vintage</button>
        </div>

        <!-- Watch Cards Container -->
        <div id="watchList" class="space-y-4"></div>
    </div>

                        <input type="text" id="refNumber" placeholder="126610LN" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">

                    <div>

                        <input type="number" id="currentValue" placeholder="14500" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">

                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Serial Number</label>
                        <input type="text" id="serialNumber" placeholder="X829F114" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">

                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>

                        <input type="text" id="crystalType" placeholder="Sapphire" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>

                        <input type="text" id="bandMaterial" placeholder="Steel Oyster" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Water Resistance</label>

                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Case Material</label>
                        <input type="text" id="caseMaterial" placeholder="Stainless Steel" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Purchase Date</label>
                        <input type="date" id="purchaseDate" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">

                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Sale Price ($)</label>
                        <input type="number" id="salePrice" placeholder="15000" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>

                        <input type="text" id="dateOfManufacture" placeholder="2022" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div>

                        <button type="button" onclick="addCustomFieldPrompt()" class="text-indigo-400 hover:text-indigo-300 text-[10px] font-semibold">+ Add Custom Field</button>

                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Notes</label>

                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Images (First image is cover)</label>
                    <input type="file" id="imgs" accept="image/*" multiple onchange="handleImgs(event)" class="w-full text-xs text-slate-400 file:mr-2 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">

    <!-- Share Modal -->
    <div id="shareModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 text-slate-100 rounded-3xl w-full max-w-sm max-h-[90vh] overflow-y-auto p-6 shadow-2xl space-y-4">
            <h3 class="text-base font-bold text-white">Share / Export Options</h3>
            <div id="shareOptionsBox" class="space-y-2 max-h-60 overflow-y-auto text-xs text-slate-300 pr-1"></div>
            <div class="flex flex-col gap-2 pt-2">
                <button type="button" onclick="executeShareText()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-semibold text-xs py-2.5 rounded-xl">Share Text (SMS / App)</button>
                <button type="button" onclick="executeEmailReport()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs py-2.5 rounded-xl">Email Details</button>
                <button type="button" onclick="executeGeneratePDF()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-semibold text-xs py-2.5 rounded-xl">Print / Save as PDF</button>

            </div>
        </div>
    </div>
    <script>
        // Register Service Worker for Mobile PWA Installation
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js').then(function(reg) {
                    console.log('PWA Service Worker active:', reg.scope);
                }).catch(function(err) {
                    console.error('Service Worker registration failed:', err);
                });
            });
        }

        var watches = [];
        var allCategories = ["Diver", "Dress", "Chronograph", "Field", "Vintage"];
        var currentTempImages = [];
        var activeCategoryFilter = 'All';
        var activeShareWatchId = null;
        var customFieldDefs = [];

        function esc(s) {
            return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function normalizeWatch(w, i) {
            if (!w || typeof w !== 'object') return null;
            var id = Number(w.id);
            if (!isFinite(id) || id <= 0) id = Date.now() + i;
            var cats = Array.isArray(w.categories) ? w.categories : (w.category ? [w.category] : []);
            cats = cats.map(String).filter(Boolean);
            if (!cats.length) cats = ['General'];
            var out = Object.assign({}, w);
            out.id = id;
            out.categories = cats;
            var cf = {};
            if (w.customFields && typeof w.customFields === 'object') Object.keys(w.customFields).forEach(function(k) { cf[k] = String(w.customFields[k]); });
            out.customFields = cf;
            out.images = Array.isArray(w.images) ? w.images.filter(function(u) { return typeof u === 'string' && /^(data:image\/|https?:\/\/)/i.test(u); }) : [];
            return out;
        }

        var defaultWatches = [
            {
                id: 101,
                brand: "Rolex",
                model: "Submariner Date",
                refNumber: "126610LN",
                categories: ["Diver"],
                currentValue: "14500",
                movementType: "Automatic (3235)",
                serialNumber: "X829F114",
                caseSize: "41mm",
                lugWidth: "20mm",
                crystalType: "Sapphire",
                bandMaterial: "Steel Oyster",
                waterResistance: "300m",
                caseMaterial: "Stainless Steel",
                purchaseDate: "2023-01-15",
                purchasePrice: "10200",
                salePrice: "15000",
                dateOfManufacture: "2022",
                description: "Black dial, Cerachrom bezel. Daily driver.",
                images: ["https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&auto=format&fit=crop&q=80"]
            }
        ];

        function openIDB() {
            return new Promise(function(resolve, reject) {
                var request = indexedDB.open('WatchVaultMassiveDB', 3);
                request.onupgradeneeded = function(e) {
                    var db = e.target.result;
                    if (!db.objectStoreNames.contains('vault')) {
                        db.createObjectStore('vault');
                    }
                    if (!db.objectStoreNames.contains('categories')) {
                        db.createObjectStore('categories');
                    }
                };
                request.onsuccess = function(e) { resolve(e.target.result); };
                request.onerror = function(e) { reject(e.target.error); };
            });
        }

        async function loadVaultData() {
            try {
                var db = await openIDB();
                var tx = db.transaction(['vault', 'categories'], 'readonly');
                
                var catStore = tx.objectStore('categories');
                var catReq = catStore.get('cat_list');
                catReq.onsuccess = function() {
                    if (catReq.result && Array.isArray(catReq.result) && catReq.result.length > 0) {
                        allCategories = catReq.result;
                    }
                };

                tx.oncomplete = function() { db.close(); };
                var store = tx.objectStore('vault');
                var fReq = store.get('custom_fields');
                fReq.onsuccess = function() { if (Array.isArray(fReq.result)) customFieldDefs = fReq.result; };
                var req = store.get('watch_collection');
                req.onsuccess = function() {
                    var data = req.result;
                    if (Array.isArray(data)) {
                        watches = data.map(function(w) {
                            if (!w.categories && w.category) {
                                w.categories = [w.category];
                            } else if (!w.categories) {
                                w.categories = ['General'];
                            }
                            return w;
                        });
                    } else {
                        watches = JSON.parse(JSON.stringify(defaultWatches));
                        saveVaultData();
                    }
                    renderCategoryFilters();
                    render();
                };
                req.onerror = function() {
                    watches = JSON.parse(JSON.stringify(defaultWatches));
                    renderCategoryFilters();
                    render();
                };
            } catch(err) {
                watches = JSON.parse(JSON.stringify(defaultWatches));
                renderCategoryFilters();
                render();
            }
        }

        async function saveVaultData() {
            try {
                var db = await openIDB();
                await new Promise(function(resolve, reject) {
                    var tx = db.transaction(['vault', 'categories'], 'readwrite');
                    tx.objectStore('vault').put(watches, 'watch_collection');
                    tx.objectStore('categories').put(allCategories, 'cat_list');
                    tx.objectStore('vault').put(customFieldDefs, 'custom_fields');
                    tx.oncomplete = function() { db.close(); resolve(); };
                    tx.onerror = tx.onabort = function() { db.close(); reject(tx.error); };
                });
                return true;
            } catch (err) {
                console.error("IndexedDB save error:", err);
                alert("Could not save your changes (storage may be full). Export a backup and free some space.");
                return false;
            }
        }

        document.addEventListener('DOMContentLoaded', loadVaultData);
    </script>
    <script>
        // Handle physical/browser back button on mobile to close modals instead of exiting app
        var modalHistoryPushed = false;
        function isOpen(id) { return !document.getElementById(id).classList.contains('hidden'); }
        function anyModalOpen() { return ['detailModal', 'watchModal', 'shareModal', 'lightboxModal'].some(isOpen); }
        function pushModalState() {
            if (!modalHistoryPushed) { history.pushState({ modal: true }, ''); modalHistoryPushed = true; }
        }
        function schedulePopModalState() {
            setTimeout(function() {
                if (modalHistoryPushed && !anyModalOpen()) { modalHistoryPushed = false; history.back(); }
            }, 0);
        }
        window.addEventListener('popstate', function() {
            modalHistoryPushed = false;
            if (isOpen('lightboxModal')) closeLightbox();
            else if (isOpen('shareModal')) closeShareModal();
            else if (isOpen('detailModal')) closeDetailModal();
            else if (isOpen('watchModal')) closeModal();
            if (anyModalOpen()) pushModalState();
        });

        function openModal() {
            pushModalState();
            document.getElementById('modalTitle').innerText = 'Add Watch';
            document.getElementById('watchId').value = '';
            document.getElementById('watchForm').reset();
            currentTempImages = [];
            renderTempImagePreviews();
            renderCategoryCheckboxes([]);
            renderCustomFields({});
            document.getElementById('modalDeleteBtn').classList.add('hidden');
            document.getElementById('watchModal').classList.remove('hidden');
            document.getElementById('watchModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('watchModal').classList.add('hidden');
            document.getElementById('watchModal').classList.remove('flex');
            schedulePopModalState();
        }

        function renderCategoryCheckboxes(selectedCategories) {
            var container = document.getElementById('categoryCheckboxesContainer');
            if (!container) return;
            var cats = allCategories.slice();
            selectedCategories.forEach(function(c) { if (cats.indexOf(c) === -1) cats.push(c); });
            container.innerHTML = cats.map(function(cat) {
                var isChecked = selectedCategories.includes(cat) ? 'checked' : '';
                return '<label class="flex items-center gap-2 cursor-pointer text-xs text-slate-300 hover:text-white">' +
                    '<input type="checkbox" name="watchCategory" value="' + esc(cat) + '" ' + isChecked + ' class="rounded accent-indigo-600"><span>' + esc(cat) + '</span>' +
                '</label>';
            }).join('');
        }

        function readCustomFieldValues() {
            var out = {};
            document.querySelectorAll('#customFieldsContainer input[data-cf]').forEach(function(inp) {
                var v = inp.value.trim();
                if (v) out[inp.dataset.cf] = v;
            });
            return out;
        }

        function renderCustomFields(values) {
            values = values || {};
            var c = document.getElementById('customFieldsContainer');
            if (!c) return;
            if (!customFieldDefs.length) {
                c.innerHTML = '<p class="text-[10px] text-slate-500">No custom fields yet. Tap "+ Add Custom Field" to create one.</p>';
                return;
            }
            c.innerHTML = customFieldDefs.map(function(name, i) {
                return '<div><div class="flex justify-between items-center mb-1">' +
                    '<label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400">' + esc(name) + '</label>' +
                    '<button type="button" onclick="removeCustomField(' + i + ')" class="text-red-400 hover:text-red-300 text-[10px] font-semibold">Remove field</button></div>' +
                    '<input type="text" data-cf="' + esc(name) + '" value="' + esc(values[name] || '') + '" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"></div>';
            }).join('');
        }

        function addCustomFieldPrompt() {
            var name = prompt("Enter new field name (e.g. Warranty Expiry):");
            if (!name) return;
            name = name.trim().slice(0, 40);
            if (!name) return;
            if (customFieldDefs.some(function(n) { return n.toLowerCase() === name.toLowerCase(); })) { alert("That field already exists."); return; }
            var values = readCustomFieldValues();
            customFieldDefs.push(name);
            saveVaultData();
            renderCustomFields(values);
        }

        async function removeCustomField(i) {
            var name = customFieldDefs[i];
            if (name === undefined) return;
            if (!confirm('Remove the field "' + name + '"? Its saved values will be deleted from ALL watches.')) return;
            var values = readCustomFieldValues();
            delete values[name];
            customFieldDefs.splice(i, 1);
            watches.forEach(function(w) { if (w.customFields) delete w.customFields[name]; });
            await saveVaultData();
            renderCustomFields(values);
            render();
        }

        function addNewCategoryPrompt() {
            var newCat = prompt("Enter new category name:");
            if (newCat && newCat.trim() !== '') {
                var formatted = newCat.trim();
                if (!allCategories.includes(formatted)) {
                    allCategories.push(formatted);
                    saveVaultData();
                    renderCategoryFilters();
                    
                    var selected = Array.from(document.querySelectorAll('input[name="watchCategory"]:checked')).map(function(cb) { return cb.value; });
                    selected.push(formatted);
                    renderCategoryCheckboxes(selected);
                }
            }
        }

        function renderCategoryFilters() {
            var filterContainer = document.getElementById('catFilters');
            if (!filterContainer) return;
            var cats = allCategories.slice();
            watches.forEach(function(w) { (w.categories || []).forEach(function(c) { if (cats.indexOf(c) === -1) cats.push(c); }); });
            if (activeCategoryFilter !== 'All' && cats.indexOf(activeCategoryFilter) === -1) activeCategoryFilter = 'All';
            var base = ' text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border shadow-sm transition-all';
            function btn(cat) {
                var on = activeCategoryFilter === cat;
                return '<button data-cat="' + esc(cat) + '" onclick="setFilter(this.dataset.cat, this)" class="filter-btn ' + (on ? 'active bg-indigo-600 text-white border-indigo-500' : 'bg-slate-900 text-slate-400 border-slate-800 hover:text-slate-200') + base + '">' + esc(cat) + '</button>';
            }
            filterContainer.innerHTML = btn('All') + cats.map(btn).join('');
        }

        function setFilter(category, element) {
            activeCategoryFilter = category;
            document.querySelectorAll('.filter-btn').forEach(function(btn) {
                btn.className = 'filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all';
            });
            element.className = 'filter-btn active bg-indigo-600 text-white text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-indigo-500 shadow-sm transition-all';
            render();
        }

        function compressImage(file, callback) {
            var reader = new FileReader();
            reader.onerror = function() { callback(null); };
            reader.onload = function(e) {
                var img = new Image();
                img.onerror = function() { callback(null); };
                img.onload = function() {
                    var max = 800, width = img.width, height = img.height;
                    if (width > height) { if (width > max) { height *= max / width; width = max; } }
                    else if (height > max) { width *= max / height; height = max; }
                    var canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    var ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, width, height);
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function handleImgs(e) {
            var input = e.target;
            var files = Array.from(input.files || []);
            if (!files.length) return;
            var results = await Promise.all(files.map(function(f) { return new Promise(function(res) { compressImage(f, res); }); }));
            var failed = 0;
            results.forEach(function(r) { if (r) currentTempImages.push(r); else failed++; });
            input.value = '';
            renderTempImagePreviews();
            if (failed) alert(failed + " image(s) couldn't be read (unsupported format?) and were skipped.");
        }

        function renderTempImagePreviews() {
            var container = document.getElementById('imagePreviewContainer');
            if(!container) return;
            container.innerHTML = currentTempImages.map(function(imgSrc, index) {
                var leftBtn = index > 0 ? '<button type="button" onclick="moveTempImage(' + index + ', -1)" class="bg-slate-800/80 hover:bg-slate-700 text-white w-4 h-4 rounded flex items-center justify-center text-[10px] font-bold">‹</button>' : '';
                var rightBtn = index < currentTempImages.length - 1 ? '<button type="button" onclick="moveTempImage(' + index + ', 1)" class="bg-slate-800/80 hover:bg-slate-700 text-white w-4 h-4 rounded flex items-center justify-center text-[10px] font-bold">›</button>' : '';

                return '<div class="relative w-20 h-20 flex-shrink-0 rounded-xl overflow-hidden border border-slate-700 bg-slate-950 flex flex-col items-center justify-between p-1">' +
                    '<img src="' + imgSrc + '" class="absolute inset-0 w-full h-full object-cover opacity-80">' +
                    '<div class="relative z-10 w-full flex justify-end">' +
                        '<button type="button" onclick="removeTempImage(' + index + ')" class="bg-red-600 hover:bg-red-500 text-white w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold shadow">&times;</button>' +
                    '</div>' +
                    '<div class="relative z-10 w-full flex justify-between px-1 pb-0.5">' +
                        leftBtn +
                        rightBtn +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function moveTempImage(index, direction) {
            var targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= currentTempImages.length) return;
            var item = currentTempImages.splice(index, 1)[0];
            currentTempImages.splice(targetIndex, 0, item);
            renderTempImagePreviews();
        }

        function removeTempImage(index) {
            currentTempImages.splice(index, 1);
            renderTempImagePreviews();
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            
            var selectedCategories = Array.from(document.querySelectorAll('input[name="watchCategory"]:checked')).map(function(cb) { return cb.value; });
            if (selectedCategories.length === 0) {
                selectedCategories = ['General'];
            }

            var id = document.getElementById('watchId').value;

            var watchData = {
                id: id ? Number(id) : Date.now(),
                brand: document.getElementById('brand').value,
                model: document.getElementById('model').value,
                refNumber: document.getElementById('refNumber').value,
                categories: selectedCategories,
                currentValue: document.getElementById('currentValue').value,
                movementType: document.getElementById('movementType').value,
                serialNumber: document.getElementById('serialNumber').value,
                caseSize: document.getElementById('caseSize').value,
                lugWidth: document.getElementById('lugWidth').value,
                crystalType: document.getElementById('crystalType').value,
                bandMaterial: document.getElementById('bandMaterial').value,
                waterResistance: document.getElementById('waterResistance').value,
                caseMaterial: document.getElementById('caseMaterial').value,
                purchaseDate: document.getElementById('purchaseDate').value,
                purchasePrice: document.getElementById('purchasePrice').value,
                salePrice: document.getElementById('salePrice').value,
                dateOfManufacture: document.getElementById('dateOfManufacture').value,
                description: document.getElementById('description').value,
                customFields: readCustomFieldValues(),
                images: currentTempImages.slice()
            };

            if (id) {
                var idx = watches.findIndex(function(w) { return w.id === Number(id); });
                if (idx !== -1) watches[idx] = watchData;
            } else {
                watches.push(watchData);
            }

            await saveVaultData();
            closeModal();
            renderCategoryFilters();
            render();
        }
    </script>
    <script>
        function openDetailModal(id) {
            
            var w = watches.find(function(item) { return item.id === Number(id); });
            if (!w) return;
            pushModalState();

            var titleStr = (w.brand || '') + (w.model ? ' ' + w.model : '');
            document.getElementById('detTitle').innerText = titleStr;
            document.getElementById('detVal').innerText = w.currentValue ? '$' + Number(w.currentValue).toLocaleString() : '$0';
            document.getElementById('detMovement').innerText = w.movementType || 'N/A';
            document.getElementById('detRefNumber').innerText = w.refNumber || 'N/A';
            document.getElementById('detSerial').innerText = w.serialNumber || 'N/A';
            document.getElementById('detDesc').innerText = w.description || 'No notes provided.';

            var specSec = document.getElementById('detSpecsSection');
            var specsData = [
                { label: 'Categories', val: w.categories ? w.categories.join(', ') : 'N/A' },
                { label: 'Case Size', val: w.caseSize },
                { label: 'Lug Width', val: w.lugWidth },
                { label: 'Crystal', val: w.crystalType },
                { label: 'Band Material', val: w.bandMaterial },
                { label: 'Water Resistance', val: w.waterResistance },
                { label: 'Case Material', val: w.caseMaterial },
                { label: 'Purchase Date', val: w.purchaseDate },
                { label: 'Purchase Price', val: w.purchasePrice ? '$' + Number(w.purchasePrice).toLocaleString() : null },
                { label: 'Sale Price', val: w.salePrice ? '$' + Number(w.salePrice).toLocaleString() : null },
                { label: 'Mfg Date', val: w.dateOfManufacture }
            ].concat(customFieldDefs.map(function(n) { return { label: n, val: (w.customFields || {})[n] }; })).filter(function(s) { return s.val; });

            if (specsData.length) {
                specSec.innerHTML = '<h4 class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1 mt-3">Additional Specifications</h4>' +
                    '<div class="grid grid-cols-2 gap-1.5 bg-slate-950 p-3 rounded-2xl border border-slate-800/80 text-xs">' +
                    specsData.map(function(s) {
                        return '<div><span class="text-slate-500 block uppercase text-[9px] font-bold">' + esc(s.label) + '</span><span class="text-slate-200">' + esc(s.val) + '</span></div>';
                    }).join('') + '</div>';
            } else {
                specSec.innerHTML = '';
            }

            var imgContainer = document.getElementById('detImagesContainer');
            if (w.images && w.images.length) {
                currentDetailImages = w.images;
                imgContainer.innerHTML = w.images.map(function(img, i) {
                    return '<img src="' + esc(img) + '" onclick="openLightboxAt(' + i + ')" class="w-full h-64 object-cover flex-shrink-0 snap-center cursor-pointer" title="Tap to enlarge">';
                }).join('');
                imgContainer.classList.remove('hidden');
                imgContainer.scrollLeft = 0;
                updateDetailDots(0);
                imgContainer.onscroll = function() { updateDetailDots(Math.round(imgContainer.scrollLeft / imgContainer.clientWidth)); };
            } else {
                imgContainer.innerHTML = '';
                imgContainer.classList.add('hidden');
                currentDetailImages = [];
                updateDetailDots(0);
            }

            document.getElementById('detEditBtn').onclick = function() { closeDetailModal(); editWatch(w.id); };
            document.getElementById('detShareBtn').onclick = function() { closeDetailModal(); openShareModal(w.id); };

            document.getElementById('detailModal').classList.remove('hidden');
            document.getElementById('detailModal').classList.add('flex');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
            document.getElementById('detailModal').classList.remove('flex');
            schedulePopModalState();
        }

        var currentDetailImages = [];
        function updateDetailDots(active) {
            var d = document.getElementById('detDots');
            var n = currentDetailImages.length;
            if (n < 2) { d.innerHTML = ''; return; }
            var h = '';
            for (var k = 0; k < n; k++) {
                h += '<button type="button" aria-label="Photo ' + (k + 1) + '" onclick="goToDetailImage(' + k + ')" class="w-2 h-2 rounded-full ' + (k === active ? 'bg-indigo-400' : 'bg-slate-600') + '"></button>';
            }
            d.innerHTML = h;
        }
        function goToDetailImage(k) {
            var c = document.getElementById('detImagesContainer');
            c.scrollTo({ left: k * c.clientWidth, behavior: 'smooth' });
        }
        function openLightboxAt(i) { if (currentDetailImages[i]) openLightbox(currentDetailImages[i]); }

        function openLightbox(imgSrc) {
            pushModalState();
            document.getElementById('lightboxImg').src = imgSrc;
            var box = document.getElementById('lightboxModal');
            box.classList.remove('hidden');
            box.classList.add('flex');
        }

        function closeLightbox() {
            var box = document.getElementById('lightboxModal');
            box.classList.add('hidden');
            box.classList.remove('flex');
            schedulePopModalState();
        }

        function editWatch(id) {
            var w = watches.find(function(item) { return item.id === Number(id); });
            if (!w) {
                console.error("Watch record not found for ID:", id);
                return;
            }

            pushModalState();

            document.getElementById('modalTitle').innerText = 'Edit Watch';
            document.getElementById('watchId').value = w.id;
            document.getElementById('brand').value = w.brand || '';
            document.getElementById('model').value = w.model || '';
            document.getElementById('refNumber').value = w.refNumber || '';
            document.getElementById('currentValue').value = w.currentValue || '';
            document.getElementById('movementType').value = w.movementType || '';
            document.getElementById('serialNumber').value = w.serialNumber || '';
            document.getElementById('caseSize').value = w.caseSize || '';
            document.getElementById('lugWidth').value = w.lugWidth || '';
            document.getElementById('crystalType').value = w.crystalType || '';
            document.getElementById('bandMaterial').value = w.bandMaterial || '';
            document.getElementById('waterResistance').value = w.waterResistance || '';
            document.getElementById('caseMaterial').value = w.caseMaterial || '';
            document.getElementById('purchaseDate').value = w.purchaseDate || '';
            document.getElementById('purchasePrice').value = w.purchasePrice || '';
            document.getElementById('salePrice').value = w.salePrice || '';
            document.getElementById('dateOfManufacture').value = w.dateOfManufacture || '';
            document.getElementById('description').value = w.description || '';

            renderCategoryCheckboxes(w.categories || []);
            renderCustomFields(w.customFields);

            currentTempImages = w.images ? [...w.images] : [];
            renderTempImagePreviews();
            
            document.getElementById('modalDeleteBtn').classList.remove('hidden');

            document.getElementById('watchModal').classList.remove('hidden');
            document.getElementById('watchModal').classList.add('flex');
        }

        async function deleteCurrentEditingWatch() {
            var id = document.getElementById('watchId').value;
            if (!id) return;
            if (confirm("Delete this watch record?")) {
                watches = watches.filter(function(w) { return w.id !== Number(id); });
                await saveVaultData();
                closeModal();
                renderCategoryFilters();
                render();
            }
        }

        async function moveWatch(id, direction) {
            var index = watches.findIndex(function(w) { return w.id === Number(id); });
            if (index === -1) return;
            
            var targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= watches.length) return;

            var item = watches.splice(index, 1)[0];
            watches.splice(targetIndex, 0, item);

            await saveVaultData();
            render();
        }

        function shareMoney(v) {
            if (!v) return '';
            return isNaN(Number(v)) ? String(v) : '$' + Number(v).toLocaleString();
        }

            { id: 'brand', label: 'Watch Name', def: true, get: function(w) { return (w.brand || '') + (w.model ? ' ' + w.model : ''); } },
            { id: 'ref', label: 'Ref No.', def: true, get: function(w) { return w.refNumber; } },
            { id: 'cat', label: 'Categories', def: true, get: function(w) { return w.categories ? w.categories.join(', ') : ''; } },
            { id: 'val', label: 'Estimated Value', def: true, get: function(w) { return shareMoney(w.currentValue); } },
            { id: 'mov', label: 'Movement', def: true, get: function(w) { return w.movementType; } },
            { id: 'sn', label: 'Serial No.', def: false, get: function(w) { return w.serialNumber; } },
            { id: 'case', label: 'Case Size', def: true, get: function(w) { return w.caseSize; } },
            { id: 'lug', label: 'Lug Width', def: true, get: function(w) { return w.lugWidth; } },
            { id: 'crys', label: 'Crystal', def: true, get: function(w) { return w.crystalType; } },
            { id: 'band', label: 'Band Material', def: true, get: function(w) { return w.bandMaterial; } },
            { id: 'wr', label: 'Water Resistance', def: true, get: function(w) { return w.waterResistance; } },
            { id: 'cmat', label: 'Case Material', def: true, get: function(w) { return w.caseMaterial; } },
            { id: 'pdate', label: 'Purchase Date', def: false, get: function(w) { return w.purchaseDate; } },
            { id: 'pprice', label: 'Purchase Price', def: false, get: function(w) { return shareMoney(w.purchasePrice); } },
            { id: 'sprice', label: 'Sale Price', def: false, get: function(w) { return shareMoney(w.salePrice); } },
            { id: 'mfg', label: 'Mfg Date', def: true, get: function(w) { return w.dateOfManufacture; } }
        ];

        function getShareItems(w) {
            var items = SHARE_FIELDS.map(function(f) { return { id: 'sb_' + f.id, label: f.label, val: f.get(w), def: f.def }; });
            customFieldDefs.forEach(function(n, i) { items.push({ id: 'sb_cf_' + i, label: n, val: (w.customFields || {})[n], def: true }); });
            items.push({ id: 'sb_desc', label: 'Notes', val: w.description, def: false });
            return items.filter(function(it) { return it.val; });
        }

        function isShareChecked(id) {
            var el = document.getElementById(id);
            return !!(el && el.checked);
        }

        function toggleAllShare(on) {
            document.querySelectorAll('#shareOptionsBox input[type=checkbox]').forEach(function(cb) { cb.checked = on; });
        }

        function openShareModal(id) {
            activeShareWatchId = Number(id);
            var w = watches.find(function(item) { return item.id === Number(id); });
            if (!w) return;
            pushModalState();
            var rowCls = 'flex items-start gap-2 cursor-pointer hover:text-white';
            var html = '<div class="flex gap-4 text-[10px] font-semibold pb-1"><button type="button" onclick="toggleAllShare(true)" class="text-indigo-400">Select all</button><button type="button" onclick="toggleAllShare(false)" class="text-slate-400">Clear all</button></div>';
            getShareItems(w).forEach(function(item) {
                var v = String(item.val);
                if (v.length > 60) v = v.slice(0, 60) + '…';
                html += '<label class="' + rowCls + '"><input type="checkbox" id="' + item.id + '" ' + (item.def ? 'checked' : '') + ' class="rounded accent-indigo-600 mt-0.5"><span>' + esc(item.label) + ': ' + esc(v) + '</span></label>';
            });
            if (w.images && w.images.length) {
                html += '<label class="' + rowCls + '"><input type="checkbox" id="sb_photos" checked class="rounded accent-indigo-600 mt-0.5"><span>Photos (' + w.images.length + ') — PDF only</span></label>';
            }
            document.getElementById('shareOptionsBox').innerHTML = html;
            document.getElementById('shareModal').classList.remove('hidden');
            document.getElementById('shareModal').classList.add('flex');
        }

        function closeShareModal() {
            document.getElementById('shareModal').classList.add('hidden');
            document.getElementById('shareModal').classList.remove('flex');
            schedulePopModalState();
        }

        function buildShareTextPayload() {
            var w = watches.find(function(item) { return item.id === Number(activeShareWatchId); });
            if (!w) return '';
            var txt = "⌚ Watch Details Report\n";
            getShareItems(w).forEach(function(it) {
                if (isShareChecked(it.id)) txt += it.label + ": " + it.val + "\n";
            });
            return txt;
        }

        function getShareWatch() {
            return watches.find(function(item) { return item.id === Number(activeShareWatchId); });
        }

        function executeShareText() {
            var w = getShareWatch();
            if (!w) return;
            var txt = buildShareTextPayload();
            closeShareModal();
            var titleStr = (w.brand || '') + (w.model ? ' ' + w.model : '');
            if (navigator.share) navigator.share({ title: titleStr, text: txt }).catch(function() {});
            else prompt("Copy report to share:", txt);
        }

        function executeEmailReport() {
            var w = getShareWatch();
            if (!w) return;
            var txt = buildShareTextPayload();
            closeShareModal();
            var titleStr = (w.brand || '') + (w.model ? ' ' + w.model : '');
            window.location.href = "mailto:?subject=" + encodeURIComponent("Watch Specification: " + titleStr) + "&body=" + encodeURIComponent(txt);
        }

        function executeGeneratePDF() {
            var w = getShareWatch();
            if (!w) return;
            var sel = getShareItems(w).filter(function(it) { return isShareChecked(it.id); });
            var withPhotos = isShareChecked('sb_photos');
            if (!sel.length && !withPhotos) { alert('Select at least one item to include.'); return; }
            var byId = {};
            sel.forEach(function(it) { byId[it.id] = it; });
            function cell(label, val, cls) {
                return '<div class="c"><div class="l">' + esc(label) + '</div><div class="v ' + (cls || '') + '">' + esc(val) + '</div></div>';
            }
            var topDefs = [['sb_val', 'Estimated Value', 'g'], ['sb_mov', 'Movement', ''], ['sb_ref', 'Reference No.', 'm'], ['sb_sn', 'Serial Number', 'm']];
            var topHtml = topDefs.map(function(d) { return byId[d[0]] ? cell(d[1], byId[d[0]].val, d[2]) : ''; }).join('');
            var skip = ['sb_brand', 'sb_desc', 'sb_val', 'sb_mov', 'sb_ref', 'sb_sn'];
            var specHtml = sel.filter(function(it) { return skip.indexOf(it.id) === -1; }).map(function(it) { return cell(it.label, it.val, ''); }).join('');
            var imgs = withPhotos ? (w.images || []) : [];

            var css = '@page{margin:0}*{box-sizing:border-box}' +
                'html,body{margin:0;background:#0f172a;color:#e2e8f0;font-family:-apple-system,Roboto,Helvetica,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
                '.wrap{max-width:640px;margin:0 auto;padding:22px 24px}' +
                '.cover{display:block;max-width:100%;max-height:260px;width:auto;height:auto;margin:0 auto;border-radius:18px;border:1px solid #1e293b}' +
                'h1{color:#fff;font-size:26px;margin:18px 0 16px;break-after:avoid}' +
                '.h{color:#64748b;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:22px 0 8px;break-after:avoid}' +
                '.box{background:#020617;border:1px solid #1e293b;border-radius:18px;padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;break-inside:avoid}' +
                '.l{color:#64748b;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}' +
                '.v{font-size:15px;color:#e2e8f0;word-break:break-word}.g{color:#34d399;font-weight:700;font-size:18px}' +
                '.m{font-family:ui-monospace,Menlo,Consolas,monospace}.note{display:block;white-space:pre-wrap}' +
                '.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px}' +
                '.grid img{flex:0 0 auto;width:auto;height:130px;max-width:100%;border-radius:12px;border:1px solid #1e293b;break-inside:avoid}' +
                '.foot{color:#475569;font-size:10px;text-align:center;margin-top:16px}';

            var body = '<div class="wrap">' +
                (imgs.length ? '<img class="cover" src="' + esc(imgs[0]) + '">' : '') +
                (imgs.length > 1 ? '<div class="grid">' + imgs.slice(1).map(function(src) { return '<img src="' + esc(src) + '">'; }).join('') + '</div>' : '') +
                (byId.sb_brand ? '<h1>' + esc(byId.sb_brand.val) + '</h1>' : '') +
                (topHtml ? '<div class="box">' + topHtml + '</div>' : '') +
                (specHtml ? '<div class="h">Additional Specifications</div><div class="box">' + specHtml + '</div>' : '') +
                (byId.sb_desc ? '<div class="h">Notes</div><div class="box" style="display:block"><span class="v note">' + esc(byId.sb_desc.val) + '</span></div>' : '') +
                '<div class="foot">Watch Vault &middot; ' + new Date().toLocaleDateString() + '</div></div>';

            closeShareModal();
            var win = window.open('', '_blank', 'width=700,height=900');
            if (!win) { alert('Pop-up blocked. Allow pop-ups for this site to print or save the report as PDF.'); return; }
            win.document.write('<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Watch Report</title><style>' + css + '</style></head><body>' + body + '</body></html>');
            win.document.close();
            var els = Array.from(win.document.images), pending = els.length, printed = false;
            function go() { if (printed) return; printed = true; win.focus(); win.print(); }
            function check() { if (--pending <= 0) setTimeout(go, 200); }
            if (!pending) { setTimeout(go, 300); return; }
            els.forEach(function(im) { if (im.complete) check(); else { im.onload = check; im.onerror = check; } });
            setTimeout(go, 8000);
        }

        function exportBackup() {
            var blob = new Blob([JSON.stringify({ watches: watches, categories: allCategories, customFields: customFieldDefs }, null, 2)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var dl = document.createElement('a');
            dl.href = url;
            dl.download = "watch_vault_backup_" + new Date().toISOString().slice(0, 10) + ".json";
            document.body.appendChild(dl);
            dl.click();
            dl.remove();
            setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
        }

        function importBackup(e) {
            var input = e.target;
            var file = input.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = async function(evt) {
                try {
                    var parsed = JSON.parse(evt.target.result);
                    var raw = Array.isArray(parsed) ? parsed : parsed.watches;
                    if (!Array.isArray(raw)) throw new Error('No watches array');
                    var imported = raw.map(normalizeWatch).filter(Boolean);
                    var cats = (!Array.isArray(parsed) && Array.isArray(parsed.categories)) ? parsed.categories.map(String).filter(Boolean) : [];
                    var cfs = (!Array.isArray(parsed) && Array.isArray(parsed.customFields)) ? parsed.customFields.map(String).filter(Boolean) : [];
                    imported.forEach(function(w) { Object.keys(w.customFields || {}).forEach(function(k) { if (cfs.indexOf(k) === -1) cfs.push(k); }); });
                    var replace = confirm("Import " + imported.length + " watches.\n\nOK = REPLACE your current collection\nCancel = choose merge instead");
                    if (!replace && !confirm("Merge these watches into your current collection? (Same-ID watches are updated.)")) return;
                    if (replace) {
                        watches = imported;
                        if (cats.length) allCategories = cats;
                        customFieldDefs = cfs;
                    } else {
                        var map = {}, seen = {}, merged = [];
                        watches.concat(imported).forEach(function(w) { map[w.id] = w; });
                        watches.concat(imported).forEach(function(w) { if (!seen[w.id]) { seen[w.id] = 1; merged.push(map[w.id]); } });
                        watches = merged;
                        cats.forEach(function(c) { if (allCategories.indexOf(c) === -1) allCategories.push(c); });
                        cfs.forEach(function(f) { if (customFieldDefs.indexOf(f) === -1) customFieldDefs.push(f); });
                    }
                    var ok = await saveVaultData();
                    renderCategoryFilters();
                    render();
                    if (ok) alert("Collection imported!");
                } catch (err) { alert("Invalid JSON backup file format."); }
            };
            reader.readAsText(file);
            input.value = '';
        }

        function render() {
            var totalVal = watches.reduce(function(sum, w) {
                return sum + (Number(w.currentValue) || 0);
            }, 0);
            var headerColEl = document.getElementById('headerCollectionVal');
            if (headerColEl) headerColEl.innerText = '$' + totalVal.toLocaleString();

            var list = document.getElementById('watchList');
            if (!list) return;

            var filtered = activeCategoryFilter === 'All' ? watches : watches.filter(function(w) { 
                return w.categories && w.categories.includes(activeCategoryFilter); 
            });

            if (!filtered || !filtered.length) {
                list.innerHTML = '<div class="text-center py-12 text-slate-500 text-xs font-medium bg-slate-900 border border-slate-800 rounded-2xl">No watches found in this category.</div>';
                return;
            }

            list.innerHTML = filtered.map(function(w, idx) {
                var imgCover = (w.images && w.images.length) ? '<img src="' + esc(w.images[0]) + '" class="w-full h-44 object-cover cursor-pointer" onclick="openDetailModal(' + w.id + ')">' : '';
                var displayTitle = esc((w.brand || '') + (w.model ? ' ' + w.model : ''));
                
                var categoryBadges = w.categories ? w.categories.map(function(c) {
                    return '<span class="bg-indigo-950/80 text-indigo-300 text-[10px] font-bold px-2 py-0.5 rounded-full border border-indigo-800/50">' + esc(c) + '</span>';
                }).join('') : '<span class="bg-indigo-950/80 text-indigo-300 text-[10px] font-bold px-2.5 py-1 rounded-full border border-indigo-800/50">General</span>';

                var moveButtons = activeCategoryFilter === 'All' ? 
                    '<div class="flex gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800">' +
                        '<button onclick="moveWatch(' + w.id + ', -1)" ' + (idx === 0 ? 'disabled class="text-slate-700 px-1.5 text-xs cursor-not-allowed"' : 'class="text-slate-300 hover:text-white px-1.5 text-xs"') + '>↑</button>' +
                        '<button onclick="moveWatch(' + w.id + ', 1)" ' + (idx === filtered.length - 1 ? 'disabled class="text-slate-700 px-1.5 text-xs cursor-not-allowed"' : 'class="text-slate-300 hover:text-white px-1.5 text-xs"') + '>↓</button>' +
                    '</div>' : '';

                return '<div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg transition-all hover:border-slate-700">' +
                    imgCover +
                    '<div class="p-4 space-y-2 cursor-pointer" onclick="openDetailModal(' + w.id + ')">' +
                        '<div class="flex justify-between items-center gap-2">' +
                            '<span class="text-emerald-400 font-bold text-sm">' + (w.currentValue ? '$' + Number(w.currentValue).toLocaleString() : '$0') + '</span>' +
                            '<div class="flex flex-wrap gap-1 justify-end">' + categoryBadges + '</div>' +
                        '</div>' +
                        '<h3 class="text-base font-bold text-white hover:text-indigo-400">' + displayTitle + '</h3>' +
                        (w.refNumber ? '<p class="text-xs text-indigo-300/80 font-mono">Ref: ' + esc(w.refNumber) + '</p>' : '') +
                        '<p class="text-xs text-slate-400 leading-relaxed line-clamp-2">' + esc(w.description || 'No description provided.') + '</p>' +
                    '</div>' +
                    '<div class="flex justify-between items-center px-4 pb-4 pt-2 border-t border-slate-800/80">' +
                        '<div class="flex gap-1.5 items-center">' +
                            '<button onclick="editWatch(' + w.id + ')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-3 py-1.5 rounded-lg transition-all">Edit</button>' +
                            '<button onclick="openShareModal(' + w.id + ')" class="bg-indigo-900/40 hover:bg-indigo-900/60 text-indigo-300 text-xs font-semibold px-3 py-1.5 rounded-lg border border-indigo-800/50 transition-all">Share / PDF</button>' +
                        '</div>' +
                        '<div>' + moveButtons + '</div>' +
                    '</div>' +
                '</div>';
            }).join('');
        }
    </script>
</body>
</html>
