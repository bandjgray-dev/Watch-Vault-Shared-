                '.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px}' +
                '.grid img{flex:0 0 auto;width:auto;height:130px;max-width:100%;border-radius:12px;border:1px solid #1e293b;break-inside:avoid}' +
                '.foot{color:#475569;font-size:10px;text-align:center;margin-top:16px}';

            var body = '<div class="wrap">' +
                (imgs.length ? '<img class="cover" src="' + esc(imgs[0]) + '">' : '') +
                (imgs.length > 1 ? '<div class="grid">' + imgs.slice(1).map(function(src) { return '<img src="' + esc(src) + '">'; }).join('') + '</div>' : '') +
                (byId.sb_brand ? '<h1>' + esc(byId.sb_brand.val) + '</h1>' : '') +
                (topHtml ? '<div class="box">' + topHtml + '</div>' : '') +
                (specHtml ? '<div class="h">Additional Specifications</div><div class="box">' + specHtml + '</div>' : '') +
                (byId.sb_desc ? '<div class="h">Notes</div><div class="box" style="display:block"><span class="v note">' + esc(byId.sb_desc.val) + '</span></div>' : '') +
                '<div class="foot">Watch Vault &middot; ' + new Date().toLocaleDateString() + '</div></div>';

            closeShareModal();
            var win = window.open('', '_blank', 'width=700,height=900');
            if (!win) { toast('Pop-up blocked. Allow pop-ups for this site to print or save the report as PDF.'); return; }
            win.document.write('<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Watch Report</title><style>' + css + '</style></head><body>' + body + '</body></html>');
            win.document.close();
            var els = Array.from(win.document.images), pending = els.length, printed = false;
            function go() { if (printed) return; printed = true; win.focus(); win.print(); }
            function check() { if (--pending <= 0) setTimeout(go, 200); }
            if (!pending) { setTimeout(go, 300); return; }
            els.forEach(function(im) { if (im.complete) check(); else { im.onload = check; im.onerror = check; } });
            setTimeout(go, 8000);
        }

        function exportBackup() {
            var blob = new Blob([JSON.stringify({ watches: watches, categories: allCategories, customFields: customFieldDefs }, null, 2)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var dl = document.createElement('a');
            dl.href = url;
            dl.download = "watch_vault_backup_" + new Date().toISOString().slice(0, 10) + ".json";
            document.body.appendChild(dl);
            dl.click();
            dl.remove();
            setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
            setLastBackup();
            renderBackupStatus();
            toast('Backup saved');
        }

        function importBackup(e) {
            var input = e.target;
            var file = input.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = async function(evt) {
                try {
                    var parsed = JSON.parse(evt.target.result);
                    var raw = Array.isArray(parsed) ? parsed : parsed.watches;
                    if (!Array.isArray(raw)) throw new Error('No watches array');
                    var imported = raw.map(normalizeWatch).filter(Boolean);
                    var cats = (!Array.isArray(parsed) && Array.isArray(parsed.categories)) ? parsed.categories.map(String).filter(Boolean) : [];
                    var cfs = (!Array.isArray(parsed) && Array.isArray(parsed.customFields)) ? parsed.customFields.map(String).filter(Boolean) : [];
                    imported.forEach(function(w) { Object.keys(w.customFields || {}).forEach(function(k) { if (cfs.indexOf(k) === -1) cfs.push(k); }); });
                    var merge = await uiConfirm("Import " + imported.length + " watches.\nMerge them into your current collection? (Same-ID watches are updated.)", "Merge");
                    var replace = false;
                    if (!merge) { replace = await uiConfirm("Replace your whole collection with this backup instead?", "Replace", true); if (!replace) return; }
                    if (replace) {
                        watches = imported;
                        if (cats.length) allCategories = cats;
                        customFieldDefs = cfs;
                    } else {
                        var map = {}, seen = {}, merged = [];
                        watches.concat(imported).forEach(function(w) { map[w.id] = w; });
                        watches.concat(imported).forEach(function(w) { if (!seen[w.id]) { seen[w.id] = 1; merged.push(map[w.id]); } });
                        watches = merged;
                        cats.forEach(function(c) { if (allCategories.indexOf(c) === -1) allCategories.push(c); });
                        cfs.forEach(function(f) { if (customFieldDefs.indexOf(f) === -1) customFieldDefs.push(f); });
                    }
                    var ok = await saveVaultData();
                    renderCategoryFilters();
                    render();
                    if (ok) toast("Collection imported!");
                } catch (err) { toast("Invalid JSON backup file format."); }
            };
            reader.readAsText(file);
            input.value = '';
        }

        var currentTempService = [], searchQuery = '', dragState = null, svcNotified = false;
        var sortMode = (function() { try { return localStorage.getItem('wv_sort') || 'custom'; } catch (e) { return 'custom'; } })();

        // ----- in-app dialogs & toasts -----
        function uiDialog(msg, o) {
            return new Promise(function(resolve) {
                var d = document.getElementById('uiDialog'), inp = document.getElementById('uiDialogInput');
                var ok = document.getElementById('uiDialogOk'), cancel = document.getElementById('uiDialogCancel');
                document.getElementById('uiDialogMsg').textContent = msg;
                inp.classList.toggle('hidden', !o.input);
                inp.value = ''; inp.placeholder = o.placeholder || '';
                ok.textContent = o.ok || 'OK';
                ok.className = (o.danger ? 'bg-red-600' : 'bg-indigo-600') + ' text-white font-semibold text-sm px-5 py-2.5 rounded-xl';
                d.classList.remove('hidden'); d.classList.add('flex');
                function done(v) { d.classList.add('hidden'); d.classList.remove('flex'); ok.onclick = cancel.onclick = inp.onkeydown = null; resolve(v); }
                ok.onclick = function() { done(o.input ? inp.value : true); };
                cancel.onclick = function() { done(o.input ? null : false); };
                inp.onkeydown = function(e) { if (e.key === 'Enter') { e.preventDefault(); ok.onclick(); } };
                if (o.input) setTimeout(function() { inp.focus(); }, 60);
            });
        }
        function uiPrompt(msg, placeholder) { return uiDialog(msg, { input: true, placeholder: placeholder, ok: 'Add' }); }
        function uiConfirm(msg, okLabel, danger) { return uiDialog(msg, { ok: okLabel || 'OK', danger: danger }); }
        function toast(msg, actionLabel, actionFn) {
            var box = document.getElementById('toastBox');
            if (!box) return;
            var t = document.createElement('div');
            t.className = 'pointer-events-auto bg-slate-800 border border-slate-700 text-slate-100 text-sm rounded-2xl px-4 py-3 shadow-xl flex items-center gap-4 max-w-sm';
            var sp = document.createElement('span'); sp.textContent = msg; t.appendChild(sp);
            if (actionFn) {
                var b = document.createElement('button');
                b.textContent = actionLabel || 'Undo'; b.className = 'text-indigo-400 font-bold text-sm px-1 py-1';
                b.onclick = function() { actionFn(); t.remove(); };
                t.appendChild(b);
            }
            box.appendChild(t);
            setTimeout(function() { t.remove(); }, actionFn ? 7000 : 3500);
        }

        // ----- backup reminder -----
        function getLastBackup() { try { return Number(localStorage.getItem('wv_last_backup')) || 0; } catch (e) { return 0; } }
        function setLastBackup() { try { localStorage.setItem('wv_last_backup', String(Date.now())); } catch (e) {} }
        function renderBackupStatus() {
            var el = document.getElementById('backupStatus');
            if (!el) return;
            var t = getLastBackup();
            if (!t) { el.className = 'text-xs text-center text-amber-400 -mt-2'; el.textContent = '\u26a0 No backup yet. Tap Export Backup to protect your collection.'; return; }
            var days = Math.floor((Date.now() - t) / 86400000), stale = days >= 30;
            el.className = 'text-xs text-center -mt-2 ' + (stale ? 'text-amber-400' : 'text-slate-400');
            el.textContent = (stale ? '\u26a0 ' : '') + 'Last backup: ' + (days === 0 ? 'today' : days === 1 ? 'yesterday' : days + ' days ago') + (stale ? '. Time to back up again.' : '');
        }

        // ----- service history -----
        function todayStr() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
        function addServiceEntry() {
            var date = document.getElementById('svcDate').value || todayStr();
            var note = document.getElementById('svcNote').value.trim();
            var cost = document.getElementById('svcCost').value;
            var next = document.getElementById('svcNext').value;
            if (!note && !cost && !next) { toast('Enter what was done, a cost or a next-due date.'); return; }
            currentTempService.push({ id: Date.now() + currentTempService.length, date: date, note: note, cost: cost, next: next });
            ['svcDate', 'svcNote', 'svcCost', 'svcNext'].forEach(function(id) { document.getElementById(id).value = ''; });
            renderServiceList();
        }
        function flushServiceInputs() {
            if (document.getElementById('svcNote').value.trim() || document.getElementById('svcCost').value || document.getElementById('svcNext').value) addServiceEntry();
        }
        function removeServiceEntry(i) { currentTempService.splice(i, 1); renderServiceList(); }
        function renderServiceList() {
            var c = document.getElementById('serviceList');
            if (!c) return;
            if (!currentTempService.length) { c.innerHTML = '<p class="text-xs text-slate-400">No service entries yet.</p>'; return; }
            c.innerHTML = currentTempService.map(function(e, i) {
                return '<div class="flex justify-between items-start gap-2 bg-slate-950 border border-slate-800 rounded-xl p-3"><div><div class="text-xs text-slate-400">' + esc(e.date || '') + (e.cost ? ' \u00b7 $' + esc(e.cost) : '') + (e.next ? ' \u00b7 next ' + esc(e.next) : '') + '</div><div class="text-sm text-slate-200">' + esc(e.note || 'Service') + '</div></div><button type="button" onclick="removeServiceEntry(' + i + ')" class="text-red-400 text-xs font-semibold px-2 py-2">Remove</button></div>';
            }).join('');
        }
        function sortedService(w) { return (w.serviceLog || []).slice().sort(function(a, b) { return String(b.date).localeCompare(String(a.date)); }); }
        function serviceText(w) {
            return sortedService(w).map(function(e) { return (e.date || '') + ' - ' + (e.note || 'Service') + (e.cost ? ' ($' + e.cost + ')' : '') + (e.next ? ' [next due ' + e.next + ']' : ''); }).join('\n');
        }
        function serviceStatus(w) {
            var nexts = (w.serviceLog || []).map(function(e) { return e.next; }).filter(Boolean).sort();
            if (!nexts.length) return null;
            var next = nexts[nexts.length - 1], t0 = new Date(todayStr() + 'T00:00:00'), days = Math.round((new Date(next + 'T00:00:00') - t0) / 86400000);
            return { next: next, days: days, overdue: days < 0, soon: days >= 0 && days <= 30 };
        }
        function renderDetailService(w) {
            var el = document.getElementById('detServiceSection');
            if (!el) return;
            var log = sortedService(w);
            if (!log.length) { el.innerHTML = ''; return; }
            var st = serviceStatus(w), line = '';
            if (st) line = '<div class="mb-2 text-sm font-semibold ' + (st.overdue ? 'text-red-400' : st.soon ? 'text-amber-400' : 'text-slate-300') + '">Next service: ' + esc(st.next) + (st.overdue ? ' (overdue)' : st.soon ? ' (due soon)' : '') + '</div>';
            el.innerHTML = '<h4 class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Service History</h4>' + line +
                '<div class="space-y-3 bg-slate-950 p-3 rounded-2xl border border-slate-800/80">' + log.map(function(e) {
                    return '<div><div class="text-xs text-slate-400">' + esc(e.date || '') + (e.cost ? ' \u00b7 $' + esc(Number(e.cost).toLocaleString()) : '') + '</div><div class="text-sm text-slate-200">' + esc(e.note || 'Service') + '</div></div>';
                }).join('') + '</div>';
        }

        // ----- search / sort -----
        function onSearch(v) { searchQuery = v; render(); }
        function onSort(v) { sortMode = v; try { localStorage.setItem('wv_sort', v); } catch (e) {} render(); }
        function watchSearchText(w) {
            return [w.brand, w.model, w.refNumber, w.serialNumber, w.description, w.movementType, w.caseMaterial, w.bandMaterial, (w.categories || []).join(' '), Object.keys(w.customFields || {}).map(function(k) { return w.customFields[k]; }).join(' '), serviceText(w)].join(' ').toLowerCase();
        }
        function sortWatches(arr) {
            var a = arr.slice(), num = function(v) { return Number(v) || 0; }, name = function(w) { return ((w.brand || '') + ' ' + (w.model || '')).toLowerCase(); };
            if (sortMode === 'value-desc') a.sort(function(x, y) { return num(y.currentValue) - num(x.currentValue); });
            else if (sortMode === 'value-asc') a.sort(function(x, y) { return num(x.currentValue) - num(y.currentValue); });
            else if (sortMode === 'brand') a.sort(function(x, y) { return name(x).localeCompare(name(y)); });
            else if (sortMode === 'added') a.sort(function(x, y) { return y.id - x.id; });
            else if (sortMode === 'purchase') a.sort(function(x, y) { return String(y.purchaseDate || '').localeCompare(String(x.purchaseDate || '')); });
            return a;
        }

        // ----- drag to reorder -----
        document.addEventListener('pointerdown', function(e) {
            var h = e.target.closest ? e.target.closest('.drag-handle') : null;
            if (!h) return;
            var card = h.closest('[data-wid]');
            if (!card) return;
            e.preventDefault();
            try { document.getElementById('watchList').setPointerCapture(e.pointerId); } catch (err) {}
            dragState = { card: card, pid: e.pointerId };
            card.classList.add('dragging');
        });
        document.addEventListener('pointermove', function(e) {
            if (!dragState || e.pointerId !== dragState.pid) return;
            var list = document.getElementById('watchList'), card = dragState.card, y = e.clientY;
            if (y < 90) window.scrollBy(0, -14); else if (y > window.innerHeight - 90) window.scrollBy(0, 14);
            var sibs = Array.prototype.filter.call(list.children, function(c) { return c !== card; });
            for (var i = 0; i < sibs.length; i++) {
                var r = sibs[i].getBoundingClientRect();
                if (y >= r.top && y <= r.bottom) {
                    list.insertBefore(card, y < r.top + r.height / 2 ? sibs[i] : sibs[i].nextSibling);
                    break;
                }
            }
        });
        async function endDrag(e) {
            if (!dragState || e.pointerId !== dragState.pid) return;
            dragState.card.classList.remove('dragging');
            dragState = null;
            var ids = Array.prototype.map.call(document.getElementById('watchList').children, function(c) { return Number(c.dataset.wid); });
            var set = {}, slots = [], byId = {};
            ids.forEach(function(id) { set[id] = 1; });
            watches.forEach(function(w, i) { byId[w.id] = w; if (set[w.id]) slots.push(i); });
            var changed = false;
            ids.forEach(function(id, k) { if (watches[slots[k]] !== byId[id]) changed = true; watches[slots[k]] = byId[id]; });
            if (changed) { await saveVaultData(); toast('Order saved'); }
            render();
        }
        document.addEventListener('pointerup', endDrag);
        document.addEventListener('pointercancel', endDrag);

        function render() {
            var totalVal = watches.reduce(function(sum, w) { return sum + (Number(w.currentValue) || 0); }, 0);
            var headerColEl = document.getElementById('headerCollectionVal');
            if (headerColEl) headerColEl.innerText = '$' + totalVal.toLocaleString();
            renderBackupStatus();
            var sel = document.getElementById('sortSelect');
            if (sel && sel.value !== sortMode) sel.value = sortMode;

            var list = document.getElementById('watchList');
            if (!list) return;
            var q = searchQuery.trim().toLowerCase();
            var filtered = watches.filter(function(w) {
                return (activeCategoryFilter === 'All' || (w.categories && w.categories.includes(activeCategoryFilter))) && (!q || watchSearchText(w).indexOf(q) !== -1);
            });
            var canDrag = sortMode === 'custom' && !q;
            if (sortMode !== 'custom') filtered = sortWatches(filtered);

            if (!filtered.length) {
                list.innerHTML = '<div class="text-center py-12 text-slate-400 text-sm font-medium bg-slate-900 border border-slate-800 rounded-2xl">' + (q ? 'No watches match "' + esc(searchQuery.trim()) + '".' : 'No watches found in this category.') + '</div>';
                return;
            }

            list.innerHTML = filtered.map(function(w) {
                var imgCover = (w.images && w.images.length) ? '<img src="' + esc(w.images[0]) + '" class="w-full h-44 object-cover cursor-pointer" onclick="openDetailModal(' + w.id + ')">' : '';
                var displayTitle = esc((w.brand || '') + (w.model ? ' ' + w.model : ''));
                var categoryBadges = (w.categories || ['General']).map(function(c) {
                    return '<span class="bg-indigo-950/80 text-indigo-300 text-[11px] font-bold px-2 py-0.5 rounded-full border border-indigo-800/50">' + esc(c) + '</span>';
                }).join('');
                var st = serviceStatus(w);
                var svcBadge = st && (st.overdue || st.soon) ? '<span class="' + (st.overdue ? 'bg-red-950/80 text-red-300 border-red-800/60' : 'bg-amber-950/80 text-amber-300 border-amber-800/60') + ' text-[11px] font-bold px-2 py-0.5 rounded-full border">' + (st.overdue ? 'Service overdue' : 'Service due soon') + '</span>' : '';
                var handle = canDrag ? '<div class="drag-handle flex items-center justify-center w-11 h-11 -mr-2 text-slate-400 text-xl select-none cursor-grab" style="touch-action:none" title="Press and drag to reorder">\u2630</div>' : '';

                return '<div data-wid="' + w.id + '" class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg transition-all hover:border-slate-700">' +
                    imgCover +
                    '<div class="p-4 space-y-2 cursor-pointer" onclick="openDetailModal(' + w.id + ')">' +
                        '<div class="flex justify-between items-center gap-2">' +
                            '<span class="text-emerald-400 font-bold text-base">' + (w.currentValue ? '$' + Number(w.currentValue).toLocaleString() : '$0') + '</span>' +
                            '<div class="flex flex-wrap gap-1 justify-end">' + categoryBadges + svcBadge + '</div>' +
                        '</div>' +
                        '<h3 class="text-lg font-bold text-white hover:text-indigo-400">' + displayTitle + '</h3>' +
                        (w.refNumber ? '<p class="text-sm text-indigo-300/80 font-mono">Ref: ' + esc(w.refNumber) + '</p>' : '') +
                        '<p class="text-sm text-slate-400 leading-relaxed line-clamp-2">' + esc(w.description || 'No description provided.') + '</p>' +
                    '</div>' +
                    '<div class="flex justify-between items-center px-4 pb-3 pt-3 border-t border-slate-800/80">' +
                        '<div class="flex gap-2 items-center">' +
                            '<button onclick="editWatch(' + w.id + ')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-semibold px-4 py-2.5 rounded-xl transition-all">Edit</button>' +
                            '<button onclick="openShareModal(' + w.id + ')" class="bg-indigo-900/40 hover:bg-indigo-900/60 text-indigo-300 text-sm font-semibold px-4 py-2.5 rounded-xl border border-indigo-800/50 transition-all">Share / PDF</button>' +
                        '</div>' + handle +
                    '</div>' +
                '</div>';
            }).join('');

            if (!svcNotified) {
                svcNotified = true;
                var due = watches.filter(function(w) { var s = serviceStatus(w); return s && (s.overdue || s.soon); }).length;
                if (due) setTimeout(function() { toast(due + (due > 1 ? ' watches are' : ' watch is') + ' due for service'); }, 700);
            }
        }
    </script>
</body>
</html>
