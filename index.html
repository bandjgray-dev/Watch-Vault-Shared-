<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Vault</title>
    
    <!-- PWA Manifest & Mobile Icons -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Watch Vault">
    <link rel="apple-touch-icon" href="icon-512.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        details.sec > summary { list-style: none; cursor: pointer; }
        details.sec > summary::-webkit-details-marker { display: none; }
        details.sec[open] > summary .chev { transform: rotate(90deg); }
        .dragging { opacity: .85; box-shadow: 0 12px 34px rgba(0,0,0,.65); outline: 2px solid #6366f1; position: relative; z-index: 30; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12 font-sans antialiased">
    <div class="max-w-md mx-auto px-4 py-4 space-y-4">

        <!-- Top Header & Actions -->
        <header class="flex items-center justify-between bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-lg gap-2">
            <h1 class="text-base font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                Watch Vault
            </h1>
            
            <!-- Centered Circular Add Watch Pill -->
            <div class="flex flex-col items-center">
                <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Add Watch</span>
                <button onclick="openModal()" class="w-11 h-11 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-base rounded-full shadow-md active:scale-95 transition-all flex items-center justify-center">
                    +
                </button>
            </div>

            <!-- Collection Value Stack (Right Side) -->
            <div class="flex flex-col items-center text-center">
                <span class="block text-[11px] font-bold uppercase tracking-wider text-slate-400">Collection Value</span>
                <span id="headerCollectionVal" class="text-emerald-400 font-bold text-xs sm:text-sm">$0</span>
            </div>
        </header>

        <!-- Backup & Restore Bar -->
        <div class="grid grid-cols-2 gap-2">
            <button onclick="exportBackup()" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 font-medium text-sm py-3 rounded-xl text-center active:scale-95 transition-all">
                📥 Export Backup
            </button>
            <button onclick="document.getElementById('importFile').click()" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 font-medium text-sm py-3 rounded-xl text-center active:scale-95 transition-all">
                📤 Import Backup
            </button>
            <input type="file" id="importFile" accept=".json" class="hidden" onchange="importBackup(event)">
        </div>
        <div id="backupStatus" class="text-xs text-center text-slate-400 -mt-2"></div>

        <!-- Search & Sort -->
        <div class="flex gap-2">
            <input id="searchBox" type="search" placeholder="Search watches..." oninput="onSearch(this.value)" class="flex-1 min-w-0 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
            <select id="sortSelect" onchange="onSort(this.value)" class="bg-slate-900 border border-slate-800 rounded-xl px-2 py-2.5 text-xs text-slate-200 focus:outline-none">
                <option value="custom">My order</option>
                <option value="value-desc">Value: high to low</option>
                <option value="value-asc">Value: low to high</option>
                <option value="brand">Brand A-Z</option>
                <option value="added">Newest added</option>
                <option value="purchase">Purchase date</option>
            </select>
        </div>

        <!-- Horizontal Scroll Category Bar -->
        <div class="flex gap-2 overflow-x-auto no-scrollbar py-1" id="catFilters">
            <button onclick="setFilter('All', this)" class="filter-btn active bg-indigo-600 text-white text-xs font-semibold px-4 py-2.5 rounded-full whitespace-nowrap border border-indigo-500 shadow-sm transition-all">All</button>
            <button onclick="setFilter('Diver', this)" class="filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2.5 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all">Diver</button>
            <button onclick="setFilter('Dress', this)" class="filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2.5 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all">Dress</button>
            <button onclick="setFilter('Chronograph', this)" class="filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2.5 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all">Chronograph</button>
            <button onclick="setFilter('Field', this)" class="filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2.5 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all">Field</button>
            <button onclick="setFilter('Vintage', this)" class="filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2.5 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all">Vintage</button>
        </div>

        <!-- Watch Cards Container -->
        <div id="watchList" class="space-y-4"></div>
    </div>
    <!-- Add / Edit Watch Modal -->
    <div id="watchModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 items-center justify-center p-4 overflow-y-auto">
        <div id="watchModalInner" class="bg-slate-900 border border-slate-800 text-slate-100 rounded-3xl w-full max-w-md max-h-[90vh] overflow-y-auto p-6 shadow-2xl">
            <h2 id="modalTitle" class="text-lg font-bold text-white mb-4">Add Watch</h2>
            <form id="watchForm" onsubmit="handleFormSubmit(event)" class="space-y-3">
                <input type="hidden" id="watchId">
                
                <details class="sec bg-slate-950/50 border border-slate-800 rounded-2xl" open><summary class="flex justify-between items-center px-4 py-3.5 text-xs font-bold uppercase tracking-wider text-slate-200"><span>Basics</span><span class="chev text-slate-400 transition-transform">&rsaquo;</span></summary><div class="px-4 pb-4 space-y-3">
<div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Brand</label>
                        <input type="text" id="brand" required placeholder="Rolex" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Model (Optional)</label>
                        <input type="text" id="model" placeholder="Submariner" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <!-- Multiple Categories Checkbox Selection & Custom Add -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400">Categories (Select Multiple)</label>
                        <button type="button" onclick="addNewCategoryPrompt()" class="text-indigo-400 hover:text-indigo-300 text-[11px] font-semibold">+ Add Custom Category</button>
                    </div>
                    <div id="categoryCheckboxesContainer" class="grid grid-cols-2 gap-2 bg-slate-950 p-3 rounded-xl border border-slate-800 max-h-32 overflow-y-auto">
                        <!-- Populated dynamically -->
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Reference Number</label>
                        <input type="text" id="refNumber" placeholder="126610LN" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Estimated Value ($)</label>
                        <input type="number" id="currentValue" placeholder="14500" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>


                
                </div></details>

                <details class="sec bg-slate-950/50 border border-slate-800 rounded-2xl"><summary class="flex justify-between items-center px-4 py-3.5 text-xs font-bold uppercase tracking-wider text-slate-200"><span>Specifications</span><span class="chev text-slate-400 transition-transform">&rsaquo;</span></summary><div class="px-4 pb-4 space-y-3">
<div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Movement</label>
                        <input type="text" id="movementType" placeholder="Automatic 3235" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Serial Number</label>
                        <input type="text" id="serialNumber" placeholder="X829F114" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Case Size</label>
                        <input type="text" id="caseSize" placeholder="41mm" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Lug Width</label>
                        <input type="text" id="lugWidth" placeholder="20mm" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Crystal Type</label>
                        <input type="text" id="crystalType" placeholder="Sapphire" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Band Material</label>
                        <input type="text" id="bandMaterial" placeholder="Steel Oyster" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Water Resistance</label>
                        <input type="text" id="waterResistance" placeholder="300m" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Case Material</label>
                        <input type="text" id="caseMaterial" placeholder="Stainless Steel" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                
                </div></details>

                <details class="sec bg-slate-950/50 border border-slate-800 rounded-2xl"><summary class="flex justify-between items-center px-4 py-3.5 text-xs font-bold uppercase tracking-wider text-slate-200"><span>Purchase & Dates</span><span class="chev text-slate-400 transition-transform">&rsaquo;</span></summary><div class="px-4 pb-4 space-y-3">
<div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Purchase Date</label>
                        <input type="date" id="purchaseDate" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Purchase Price ($)</label>
                        <input type="number" id="purchasePrice" placeholder="10200" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Sale Price ($)</label>
                        <input type="number" id="salePrice" placeholder="15000" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Mfg Date / Year</label>
                        <input type="text" id="dateOfManufacture" placeholder="2022" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                
                </div></details>

                <details class="sec bg-slate-950/50 border border-slate-800 rounded-2xl" open><summary class="flex justify-between items-center px-4 py-3.5 text-xs font-bold uppercase tracking-wider text-slate-200"><span>Custom Fields</span><span class="chev text-slate-400 transition-transform">&rsaquo;</span></summary><div class="px-4 pb-4 space-y-3">
<div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400">Custom Fields</label>
                        <button type="button" onclick="addCustomFieldPrompt()" class="text-indigo-400 hover:text-indigo-300 text-[11px] font-semibold">+ Add Custom Field</button>
                    </div>
                    <div id="customFieldsContainer" class="space-y-2"></div>
                </div>
                
                </div></details>

                <details class="sec bg-slate-950/50 border border-slate-800 rounded-2xl"><summary class="flex justify-between items-center px-4 py-3.5 text-xs font-bold uppercase tracking-wider text-slate-200"><span>Service History</span><span class="chev text-slate-400 transition-transform">&rsaquo;</span></summary><div class="px-4 pb-4 space-y-3">
<div class="grid grid-cols-2 gap-2">
                    <div><label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Date</label><input type="date" id="svcDate" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"></div>
                    <div><label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Cost ($)</label><input type="number" id="svcCost" placeholder="350" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"></div>
                </div>
                <div><label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">What was done</label><input type="text" id="svcNote" placeholder="Full service, new crystal" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"></div>
                <div class="flex items-end gap-2">
                    <div class="flex-1"><label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Next service due (optional)</label><input type="date" id="svcNext" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"></div>
                    <button type="button" onclick="addServiceEntry()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm px-4 py-2.5 rounded-xl">Add</button>
                </div>
                <div id="serviceList" class="space-y-2"></div>
                </div></details>

                <details class="sec bg-slate-950/50 border border-slate-800 rounded-2xl" open><summary class="flex justify-between items-center px-4 py-3.5 text-xs font-bold uppercase tracking-wider text-slate-200"><span>Notes</span><span class="chev text-slate-400 transition-transform">&rsaquo;</span></summary><div class="px-4 pb-4 space-y-3">
<div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Notes</label>
                    <textarea id="description" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"></textarea>
                </div>
                
                </div></details>

                <details class="sec bg-slate-950/50 border border-slate-800 rounded-2xl" open><summary class="flex justify-between items-center px-4 py-3.5 text-xs font-bold uppercase tracking-wider text-slate-200"><span>Photos</span><span class="chev text-slate-400 transition-transform">&rsaquo;</span></summary><div class="px-4 pb-4 space-y-3">
<div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Images (First image is cover)</label>
                    <input type="file" id="imgs" accept="image/*" multiple onchange="handleImgs(event)" class="w-full text-xs text-slate-400 file:mr-2 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">
                    <div id="imagePreviewContainer" class="flex gap-2 overflow-x-auto py-2"></div>
                </div>
                
                </div></details>
<div class="sticky bottom-0 -mx-6 -mb-6 px-6 py-4 bg-slate-900 border-t border-slate-800 flex justify-between items-center mt-2 z-10">
                    <button type="button" id="modalDeleteBtn" onclick="deleteCurrentEditingWatch()" class="hidden bg-red-500/10 hover:bg-red-500/20 text-red-400 font-semibold text-xs px-3 py-2.5 rounded-xl transition-all">Delete Watch</button>
                    <div class="flex justify-end gap-2 ml-auto">
                        <button type="button" onclick="closeModal()" class="bg-slate-800 text-slate-300 font-semibold text-xs px-4 py-2.5 rounded-xl">Cancel</button>
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs px-5 py-2.5 rounded-xl shadow-md">Save Watch</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <!-- Expanded Detail Modal -->
    <div id="detailModal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-sm z-50 items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 text-slate-100 rounded-3xl w-full max-w-md max-h-[90vh] overflow-y-auto p-6 shadow-2xl space-y-4">
            <div class="flex justify-end items-center">
                <button onclick="closeDetailModal()" class="bg-slate-800 text-slate-400 hover:text-white w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm">&times;</button>
            </div>
            
            <!-- Image Carousel / Gallery -->
            <div id="detImagesContainer" class="flex overflow-x-auto snap-x snap-mandatory no-scrollbar rounded-2xl border border-slate-800"></div>
            <div id="detDots" class="flex justify-center gap-2 -mt-1"></div>

            <!-- Make & Model positioned above value section -->
            <div>
                <h2 id="detTitle" class="text-lg font-bold text-white tracking-wide"></h2>
            </div>

            <!-- Specs Grid -->
            <div class="grid grid-cols-2 gap-2 bg-slate-950 p-3 rounded-2xl border border-slate-800/80 text-sm">
                <div><span class="text-slate-400 block uppercase text-[11px] font-bold">Estimated Value</span><span id="detVal" class="text-emerald-400 font-bold text-sm"></span></div>
                <div><span class="text-slate-400 block uppercase text-[11px] font-bold">Movement</span><span id="detMovement" class="text-slate-200 font-medium"></span></div>
                <div><span class="text-slate-400 block uppercase text-[11px] font-bold">Reference No.</span><span id="detRefNumber" class="text-slate-300 font-mono"></span></div>
                <div><span class="text-slate-400 block uppercase text-[11px] font-bold">Serial Number</span><span id="detSerial" class="text-slate-300 font-mono"></span></div>
            </div>

            <div id="detSpecsSection"></div>

            <div id="detServiceSection"></div>

            <div>
                <h4 class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Notes</h4>
                <p id="detDesc" class="text-sm text-slate-300 leading-relaxed bg-slate-950 p-3 rounded-2xl border border-slate-800/80"></p>
            </div>

            <div class="flex gap-2 pt-2">
                <button type="button" id="detEditBtn" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs py-2.5 rounded-xl transition-all">Edit Watch</button>
                <button type="button" id="detShareBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs py-2.5 rounded-xl transition-all">Share / PDF</button>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal (swipe / pinch) -->
    <div id="lightboxModal" class="hidden fixed inset-0 bg-black/95 z-[100] items-center justify-center overflow-hidden" style="touch-action:none">
        <button type="button" onclick="closeLightbox()" class="absolute top-4 right-4 bg-slate-800 text-white w-11 h-11 rounded-full font-bold text-xl flex items-center justify-center shadow-lg z-10">&times;</button>
        <div id="lbCount" class="absolute top-6 left-1/2 -translate-x-1/2 text-sm text-slate-300 z-10"></div>
        <button type="button" id="lbPrev" onclick="lbStep(-1)" class="absolute left-2 top-1/2 -translate-y-1/2 bg-slate-800/70 text-white w-10 h-10 rounded-full text-xl z-10">&lsaquo;</button>
        <button type="button" id="lbNext" onclick="lbStep(1)" class="absolute right-2 top-1/2 -translate-y-1/2 bg-slate-800/70 text-white w-10 h-10 rounded-full text-xl z-10">&rsaquo;</button>
        <img id="lightboxImg" src="" draggable="false" class="max-w-full max-h-full object-contain select-none" style="touch-action:none">
    </div>

    <!-- In-app dialog & toasts -->
    <div id="uiDialog" class="hidden fixed inset-0 bg-black/70 z-[300] items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl w-full max-w-sm p-6 shadow-2xl space-y-4">
            <p id="uiDialogMsg" class="text-sm text-slate-200 whitespace-pre-line"></p>
            <input id="uiDialogInput" type="text" class="hidden w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
            <div class="flex gap-2 justify-end">

    <script>
        // Register Service Worker for Mobile PWA Installation
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js').then(function(reg) {
                    console.log('PWA Service Worker active:', reg.scope);
                }).catch(function(err) {
                    console.error('Service Worker registration failed:', err);
                });
            });
        }

        var watches = [];
        var allCategories = ["Diver", "Dress", "Chronograph", "Field", "Vintage"];
        var currentTempImages = [];
        var activeCategoryFilter = 'All';
        var activeShareWatchId = null;
        var customFieldDefs = [];

        function esc(s) {
            return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function normalizeWatch(w, i) {
            if (!w || typeof w !== 'object') return null;
            var id = Number(w.id);
            if (!isFinite(id) || id <= 0) id = Date.now() + i;
            var cats = Array.isArray(w.categories) ? w.categories : (w.category ? [w.category] : []);
            cats = cats.map(String).filter(Boolean);
            if (!cats.length) cats = ['General'];
            var out = Object.assign({}, w);
            out.id = id;
            out.categories = cats;
            var cf = {};
            if (w.customFields && typeof w.customFields === 'object') Object.keys(w.customFields).forEach(function(k) { cf[k] = String(w.customFields[k]); });
            out.customFields = cf;
            out.serviceLog = Array.isArray(w.serviceLog) ? w.serviceLog.filter(function(e) { return e && typeof e === 'object'; }).map(function(e) {
                return { id: Number(e.id) || Date.now(), date: String(e.date || ''), note: String(e.note || ''), cost: String(e.cost || ''), next: String(e.next || '') };
            }) : [];
            out.images = Array.isArray(w.images) ? w.images.filter(function(u) { return typeof u === 'string' && /^(data:image\/|https?:\/\/)/i.test(u); }) : [];
            return out;
        }

        var defaultWatches = [
            {
                id: 101,
                brand: "Rolex",
                model: "Submariner Date",
                refNumber: "126610LN",
                categories: ["Diver"],
                currentValue: "14500",
                movementType: "Automatic (3235)",
                serialNumber: "X829F114",
                caseSize: "41mm",
                lugWidth: "20mm",
                crystalType: "Sapphire",
                bandMaterial: "Steel Oyster",
                waterResistance: "300m",
                caseMaterial: "Stainless Steel",
                purchaseDate: "2023-01-15",
                purchasePrice: "10200",
                salePrice: "15000",
                dateOfManufacture: "2022",
                description: "Black dial, Cerachrom bezel. Daily driver.",
                images: ["https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&auto=format&fit=crop&q=80"]
            }
        ];

        function openIDB() {
            return new Promise(function(resolve, reject) {
                var request = indexedDB.open('WatchVaultMassiveDB', 3);
                request.onupgradeneeded = function(e) {
                    var db = e.target.result;
                    if (!db.objectStoreNames.contains('vault')) {
                        db.createObjectStore('vault');
                    }
                    if (!db.objectStoreNames.contains('categories')) {
                        db.createObjectStore('categories');
                    }
                };
                request.onsuccess = function(e) { resolve(e.target.result); };
                request.onerror = function(e) { reject(e.target.error); };
            });
        }

        async function loadVaultData() {
            try {
                var db = await openIDB();
                var tx = db.transaction(['vault', 'categories'], 'readonly');
                
                var catStore = tx.objectStore('categories');
                var catReq = catStore.get('cat_list');
                catReq.onsuccess = function() {
                    if (catReq.result && Array.isArray(catReq.result) && catReq.result.length > 0) {
                        allCategories = catReq.result;
                    }
                };

                tx.oncomplete = function() { db.close(); };
                var store = tx.objectStore('vault');
                var fReq = store.get('custom_fields');
                fReq.onsuccess = function() { if (Array.isArray(fReq.result)) customFieldDefs = fReq.result; };
                var req = store.get('watch_collection');
                req.onsuccess = function() {
                    var data = req.result;
                    if (Array.isArray(data)) {
                        watches = data.map(function(w) {
                            if (!w.categories && w.category) {
                                w.categories = [w.category];
                            } else if (!w.categories) {
                                w.categories = ['General'];
                            }
                            return w;
                        });
                    } else {
                        watches = JSON.parse(JSON.stringify(defaultWatches));
                        saveVaultData();
                    }
                    renderCategoryFilters();
                    render();
                };
                req.onerror = function() {
                    watches = JSON.parse(JSON.stringify(defaultWatches));
                    renderCategoryFilters();
                    render();
                };
            } catch(err) {
                watches = JSON.parse(JSON.stringify(defaultWatches));
                renderCategoryFilters();
                render();
            }
        }

        async function saveVaultData() {
            try {
                var db = await openIDB();
                await new Promise(function(resolve, reject) {
                    var tx = db.transaction(['vault', 'categories'], 'readwrite');
                    tx.objectStore('vault').put(watches, 'watch_collection');
                    tx.objectStore('categories').put(allCategories, 'cat_list');
                    tx.objectStore('vault').put(customFieldDefs, 'custom_fields');
                    tx.oncomplete = function() { db.close(); resolve(); };
                    tx.onerror = tx.onabort = function() { db.close(); reject(tx.error); };
                });
                return true;
            } catch (err) {
                console.error("IndexedDB save error:", err);
                toast("Could not save your changes (storage may be full). Export a backup and free some space.");
                return false;
            }
        }

        document.addEventListener('DOMContentLoaded', loadVaultData);
    </script>
    <script>
        // Handle physical/browser back button on mobile to close modals instead of exiting app
        var modalHistoryPushed = false;
        function isOpen(id) { return !document.getElementById(id).classList.contains('hidden'); }
        function anyModalOpen() { return ['detailModal', 'watchModal', 'shareModal', 'lightboxModal'].some(isOpen); }
        function pushModalState() {
            if (!modalHistoryPushed) { history.pushState({ modal: true }, ''); modalHistoryPushed = true; }
        }
        function schedulePopModalState() {
            setTimeout(function() {
                if (modalHistoryPushed && !anyModalOpen()) { modalHistoryPushed = false; history.back(); }
            }, 0);
        }
        window.addEventListener('popstate', function() {
            modalHistoryPushed = false;
            if (isOpen('lightboxModal')) closeLightbox();
            else if (isOpen('shareModal')) closeShareModal();
            else if (isOpen('detailModal')) closeDetailModal();
            else if (isOpen('watchModal')) closeModal();
            if (anyModalOpen()) pushModalState();
        });

        function openModal() {
            pushModalState();
            document.getElementById('modalTitle').innerText = 'Add Watch';
            document.getElementById('watchId').value = '';
            document.getElementById('watchForm').reset();
            currentTempImages = [];
            renderTempImagePreviews();
            renderCategoryCheckboxes([]);
            renderCustomFields({});
            currentTempService = [];
            renderServiceList();
            document.getElementById('watchModalInner').scrollTop = 0;
            document.getElementById('modalDeleteBtn').classList.add('hidden');
            document.getElementById('watchModal').classList.remove('hidden');
            document.getElementById('watchModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('watchModal').classList.add('hidden');
            document.getElementById('watchModal').classList.remove('flex');
            schedulePopModalState();
        }

        function renderCategoryCheckboxes(selectedCategories) {
            var container = document.getElementById('categoryCheckboxesContainer');
            if (!container) return;
            var cats = allCategories.slice();
            selectedCategories.forEach(function(c) { if (cats.indexOf(c) === -1) cats.push(c); });
            container.innerHTML = cats.map(function(cat) {
                var isChecked = selectedCategories.includes(cat) ? 'checked' : '';
                return '<label class="flex items-center gap-2 cursor-pointer text-xs text-slate-300 hover:text-white">' +
                    '<input type="checkbox" name="watchCategory" value="' + esc(cat) + '" ' + isChecked + ' class="rounded accent-indigo-600"><span>' + esc(cat) + '</span>' +
                '</label>';
            }).join('');
        }

        function readCustomFieldValues() {
            var out = {};
            document.querySelectorAll('#customFieldsContainer input[data-cf]').forEach(function(inp) {
                var v = inp.value.trim();
                if (v) out[inp.dataset.cf] = v;
            });
            return out;
        }

        function renderCustomFields(values) {
            values = values || {};
            var c = document.getElementById('customFieldsContainer');
            if (!c) return;
            if (!customFieldDefs.length) {
                c.innerHTML = '<p class="text-[11px] text-slate-400">No custom fields yet. Tap "+ Add Custom Field" to create one.</p>';
                return;
            }
            c.innerHTML = customFieldDefs.map(function(name, i) {
                return '<div><div class="flex justify-between items-center mb-1">' +
                    '<label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400">' + esc(name) + '</label>' +
                    '<button type="button" onclick="removeCustomField(' + i + ')" class="text-red-400 hover:text-red-300 text-[11px] font-semibold">Remove field</button></div>' +
                    '<input type="text" data-cf="' + esc(name) + '" value="' + esc(values[name] || '') + '" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"></div>';
            }).join('');
        }

        async function addCustomFieldPrompt() {
            var name = await uiPrompt("New field name (e.g. Warranty Expiry):", "Field name");
            if (!name) return;
            name = name.trim().slice(0, 40);
            if (!name) return;
            if (customFieldDefs.some(function(n) { return n.toLowerCase() === name.toLowerCase(); })) { toast("That field already exists."); return; }
            var values = readCustomFieldValues();
            customFieldDefs.push(name);
            saveVaultData();
            renderCustomFields(values);
        }

        async function removeCustomField(i) {
            var name = customFieldDefs[i];
            if (name === undefined) return;
            if (!(await uiConfirm('Remove the field "' + name + '"? Its saved values will be deleted from ALL watches.', 'Remove', true))) return;
            var values = readCustomFieldValues();
            delete values[name];
            customFieldDefs.splice(i, 1);
            watches.forEach(function(w) { if (w.customFields) delete w.customFields[name]; });
            await saveVaultData();
            renderCustomFields(values);
            render();
        }

        async function addNewCategoryPrompt() {
            var newCat = await uiPrompt("New category name:", "Category name");
            if (newCat && newCat.trim() !== '') {
                var formatted = newCat.trim();
                if (!allCategories.includes(formatted)) {
                    allCategories.push(formatted);
                    saveVaultData();
                    renderCategoryFilters();
                    
                    var selected = Array.from(document.querySelectorAll('input[name="watchCategory"]:checked')).map(function(cb) { return cb.value; });
                    selected.push(formatted);
                    renderCategoryCheckboxes(selected);
                }
            }
        }

        function renderCategoryFilters() {
            var filterContainer = document.getElementById('catFilters');
            if (!filterContainer) return;
            var cats = allCategories.slice();
            watches.forEach(function(w) { (w.categories || []).forEach(function(c) { if (cats.indexOf(c) === -1) cats.push(c); }); });
            if (activeCategoryFilter !== 'All' && cats.indexOf(activeCategoryFilter) === -1) activeCategoryFilter = 'All';
            var base = ' text-xs font-semibold px-4 py-2.5 rounded-full whitespace-nowrap border shadow-sm transition-all';
            function btn(cat) {
                var on = activeCategoryFilter === cat;
                return '<button data-cat="' + esc(cat) + '" onclick="setFilter(this.dataset.cat, this)" class="filter-btn ' + (on ? 'active bg-indigo-600 text-white border-indigo-500' : 'bg-slate-900 text-slate-400 border-slate-800 hover:text-slate-200') + base + '">' + esc(cat) + '</button>';
            }
            filterContainer.innerHTML = btn('All') + cats.map(btn).join('');
        }

        function setFilter(category, element) {
            activeCategoryFilter = category;
            document.querySelectorAll('.filter-btn').forEach(function(btn) {
                btn.className = 'filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2.5 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all';
            });
            element.className = 'filter-btn active bg-indigo-600 text-white text-xs font-semibold px-4 py-2.5 rounded-full whitespace-nowrap border border-indigo-500 shadow-sm transition-all';
            render();
        }

        function compressImage(file, callback) {
            var reader = new FileReader();
            reader.onerror = function() { callback(null); };
            reader.onload = function(e) {
                var img = new Image();
                img.onerror = function() { callback(null); };
                img.onload = function() {
                    var max = 800, width = img.width, height = img.height;
                    if (width > height) { if (width > max) { height *= max / width; width = max; } }
                    else if (height > max) { width *= max / height; height = max; }
                    var canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    var ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, width, height);
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function handleImgs(e) {
            var input = e.target;
            var files = Array.from(input.files || []);
            if (!files.length) return;
            var results = await Promise.all(files.map(function(f) { return new Promise(function(res) { compressImage(f, res); }); }));
            var failed = 0;
            results.forEach(function(r) { if (r) currentTempImages.push(r); else failed++; });
            input.value = '';
            renderTempImagePreviews();
            if (failed) toast(failed + " image(s) couldn't be read (unsupported format?) and were skipped.");
        }

        function renderTempImagePreviews() {
            var container = document.getElementById('imagePreviewContainer');
            if (!container) return;
            var n = currentTempImages.length;
            var ab = 'bg-slate-900/85 text-white w-8 h-8 rounded-lg flex items-center justify-center text-lg font-bold';
            container.innerHTML = currentTempImages.map(function(src, i) {
                return '<div class="relative w-28 h-28 flex-shrink-0 rounded-xl overflow-hidden border ' + (i === 0 ? 'border-indigo-500' : 'border-slate-700') + ' bg-slate-950">' +
                    '<img src="' + esc(src) + '" class="absolute inset-0 w-full h-full object-cover">' +
                    (i === 0 ? '<span class="absolute top-1 left-1 bg-indigo-600 text-white text-[11px] font-bold px-2 py-1 rounded-lg">COVER</span>'
                             : '<button type="button" onclick="setCoverTemp(' + i + ')" class="absolute top-1 left-1 bg-black/70 text-white text-[11px] font-bold px-2 py-1 rounded-lg">&#9733; Cover</button>') +
                    '<button type="button" onclick="removeTempImage(' + i + ')" class="absolute top-1 right-1 bg-red-600 text-white w-7 h-7 rounded-full text-base font-bold flex items-center justify-center">&times;</button>' +
                    '<div class="absolute bottom-1 left-1 right-1 flex justify-between">' +
                        (i > 0 ? '<button type="button" onclick="moveTempImage(' + i + ', -1)" class="' + ab + '">&lsaquo;</button>' : '<span></span>') +
                        (i < n - 1 ? '<button type="button" onclick="moveTempImage(' + i + ', 1)" class="' + ab + '">&rsaquo;</button>' : '<span></span>') +
                    '</div></div>';
            }).join('');
        }

        function setCoverTemp(i) {
            var it = currentTempImages.splice(i, 1)[0];
            currentTempImages.unshift(it);
            renderTempImagePreviews();
        }

        function moveTempImage(index, direction) {
            var targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= currentTempImages.length) return;
            var item = currentTempImages.splice(index, 1)[0];
            currentTempImages.splice(targetIndex, 0, item);
            renderTempImagePreviews();
        }

        function removeTempImage(index) {
            currentTempImages.splice(index, 1);
            renderTempImagePreviews();
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            
            var selectedCategories = Array.from(document.querySelectorAll('input[name="watchCategory"]:checked')).map(function(cb) { return cb.value; });
            if (selectedCategories.length === 0) {
                selectedCategories = ['General'];
            }

            var id = document.getElementById('watchId').value;

            var watchData = {
                id: id ? Number(id) : Date.now(),
                brand: document.getElementById('brand').value,
                model: document.getElementById('model').value,
                refNumber: document.getElementById('refNumber').value,
                categories: selectedCategories,
                currentValue: document.getElementById('currentValue').value,
                movementType: document.getElementById('movementType').value,
                serialNumber: document.getElementById('serialNumber').value,
                caseSize: document.getElementById('caseSize').value,
                lugWidth: document.getElementById('lugWidth').value,
                crystalType: document.getElementById('crystalType').value,
                bandMaterial: document.getElementById('bandMaterial').value,
                waterResistance: document.getElementById('waterResistance').value,
                caseMaterial: document.getElementById('caseMaterial').value,
                purchaseDate: document.getElementById('purchaseDate').value,
                purchasePrice: document.getElementById('purchasePrice').value,
                salePrice: document.getElementById('salePrice').value,
                dateOfManufacture: document.getElementById('dateOfManufacture').value,
                description: document.getElementById('description').value,
                customFields: readCustomFieldValues(),
                serviceLog: (flushServiceInputs(), currentTempService.slice()),
                images: currentTempImages.slice()
            };

            if (id) {
                var idx = watches.findIndex(function(w) { return w.id === Number(id); });
                if (idx !== -1) watches[idx] = watchData;
            } else {
                watches.push(watchData);
            }

            await saveVaultData();
            closeModal();
            renderCategoryFilters();
            render();
            toast('Watch saved');
        }
    </script>
    <script>

            if (specsData.length) {

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
            document.getElementById('detailModal').classList.remove('flex');
            schedulePopModalState();
        }

        var currentDetailImages = [];
        function updateDetailDots(active) {
            var d = document.getElementById('detDots');
            var n = currentDetailImages.length;
            if (n < 2) { d.innerHTML = ''; return; }
            var h = '';
            for (var k = 0; k < n; k++) {
                h += '<button type="button" aria-label="Photo ' + (k + 1) + '" onclick="goToDetailImage(' + k + ')" class="w-2 h-2 rounded-full ' + (k === active ? 'bg-indigo-400' : 'bg-slate-600') + '"></button>';
            }
            d.innerHTML = h;
        }
        function goToDetailImage(k) {
            var c = document.getElementById('detImagesContainer');
            c.scrollTo({ left: k * c.clientWidth, behavior: 'smooth' });
        }
        var lb = { list: [], idx: 0, scale: 1, tx: 0, ty: 0 }, lbPtrs = {}, lbG = null, lbLastTap = 0;
        function lbDist() {
            var k = Object.keys(lbPtrs);
            if (k.length < 2) return 1;
            var a = lbPtrs[k[0]], b = lbPtrs[k[1]];
            return Math.hypot(a.x - b.x, a.y - b.y) || 1;
        }
        function lbApply() {

        }
        function lbReset() { lb.scale = 1; lb.tx = 0; lb.ty = 0; lbApply(); }
        function lbShow() {
            document.getElementById('lightboxImg').src = lb.list[lb.idx];
            document.getElementById('lbCount').textContent = lb.list.length > 1 ? (lb.idx + 1) + ' / ' + lb.list.length : '';
            document.getElementById('lbPrev').style.visibility = lb.idx > 0 ? 'visible' : 'hidden';
            document.getElementById('lbNext').style.visibility = lb.idx < lb.list.length - 1 ? 'visible' : 'hidden';
            lbReset();
        }
        function lbStep(d) {
            var n = lb.idx + d;
            if (n < 0 || n >= lb.list.length) return;
            lb.idx = n; lbShow();
        }
        function openLightboxAt(i) {
            if (!currentDetailImages[i]) return;
            lb.list = currentDetailImages.slice(); lb.idx = i;
            openLightbox(currentDetailImages[i]);
        }
        function openLightbox(imgSrc) {
            if (!lb.list.length) { lb.list = [imgSrc]; lb.idx = 0; }
            pushModalState();

            var box = document.getElementById('lightboxModal');

        }
        function closeLightbox() {
            var box = document.getElementById('lightboxModal');
            box.classList.add('hidden');
            box.classList.remove('flex');
            lb.list = []; lbPtrs = {}; lbG = null;
            schedulePopModalState();
        }
        (function() {
            var m = document.getElementById('lightboxModal');
            m.addEventListener('pointerdown', function(e) {
                if (e.target.closest('button')) return;
                lbPtrs[e.pointerId] = { x: e.clientX, y: e.clientY };
                lbG = { x0: e.clientX, y0: e.clientY, tx0: lb.tx, ty0: lb.ty, d0: lbDist(), s0: lb.scale, moved: false, target: e.target };
            });
            m.addEventListener('pointermove', function(e) {
                if (!lbPtrs[e.pointerId] || !lbG) return;
                lbPtrs[e.pointerId] = { x: e.clientX, y: e.clientY };
                if (Object.keys(lbPtrs).length >= 2) {
                    lb.scale = Math.min(5, Math.max(1, lbG.s0 * lbDist() / lbG.d0)); lbG.moved = true; lbApply();
                } else {
                    var dx = e.clientX - lbG.x0, dy = e.clientY - lbG.y0;
                    if (Math.abs(dx) + Math.abs(dy) > 10) lbG.moved = true;
                    if (lb.scale > 1) { lb.tx = lbG.tx0 + dx; lb.ty = lbG.ty0 + dy; lbApply(); }
                }
            });
            function end(e) {
                if (!lbPtrs[e.pointerId]) return;
                var g = lbG;
                delete lbPtrs[e.pointerId];
                var left = Object.keys(lbPtrs);
                if (left.length) {
                    var p = lbPtrs[left[0]];
                    lbG = { x0: p.x, y0: p.y, tx0: lb.tx, ty0: lb.ty, d0: 1, s0: lb.scale, moved: true, target: g && g.target };
                    return;
                }
                lbG = null;
                if (!g) return;
                if (lb.scale <= 1.05) lbReset();
                if (e.type !== 'pointerup') return;
                var dx = e.clientX - g.x0, dy = e.clientY - g.y0;
                if (lb.scale <= 1 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
                    lbStep(dx < 0 ? 1 : -1);
                } else if (!g.moved) {
                    var now = Date.now();
                    if (g.target && g.target.id === 'lightboxImg') {
                        if (now - lbLastTap < 300) { if (lb.scale > 1) lbReset(); else { lb.scale = 2.5; lbApply(); } lbLastTap = 0; }
                        else lbLastTap = now;
                    } else closeLightbox();
                }
            }
            m.addEventListener('pointerup', end);
            m.addEventListener('pointercancel', end);
        })();

        function loadImg(src) {
            return new Promise(function(res) {

        function wrapLines(x, text, maxW) {
            var out = [];
            String(text).split('\n').forEach(function(par) {
                var line = '';
                par.split(' ').forEach(function(wd) {
                    var t = line ? line + ' ' + wd : wd;
                    if (x.measureText(t).width > maxW && line) { out.push(line); line = wd; } else line = t;
                });
                out.push(line);
            });
            return out;
        }

        async function renderReportImage(w) {
            if (!isShareChecked('sb_reportimg')) return null;
            try {
                var m = getReportModel(w);
                var imgs = isShareChecked('sb_photos') ? (w.images || []) : [];
                var loaded = (await Promise.all(imgs.map(loadImg))).filter(Boolean);
                var W = 1080, P = 48, IW = W - 2 * P, F = '-apple-system, Roboto, Helvetica, Arial, sans-serif';
                var c = document.createElement('canvas');
                c.width = W; c.height = 8000;
                var x = c.getContext('2d');
                x.fillStyle = '#0f172a'; x.fillRect(0, 0, W, 8000);
                x.textBaseline = 'top';
                var y = P;
                function rr(px, py, pw, ph, r) {
                    x.beginPath(); x.moveTo(px + r, py);
                    x.arcTo(px + pw, py, px + pw, py + ph, r); x.arcTo(px + pw, py + ph, px, py + ph, r);
                    x.arcTo(px, py + ph, px, py, r); x.arcTo(px, py, px + pw, py, r); x.closePath();
                }
                function drawImg(im, px, py, pw, ph, r) {
                    x.save(); rr(px, py, pw, ph, r); x.clip(); x.drawImage(im, px, py, pw, ph); x.restore();
                    rr(px, py, pw, ph, r); x.strokeStyle = '#1e293b'; x.lineWidth = 2; x.stroke();
                }
                function boxBg(h) { rr(P, y, IW, h, 36); x.fillStyle = '#020617'; x.fill(); x.strokeStyle = '#1e293b'; x.lineWidth = 2; x.stroke(); }
                function heading(t) {
                    x.font = 'bold 24px ' + F; x.letterSpacing = '3px'; x.fillStyle = '#94a3b8';
                    x.fillText(t.toUpperCase(), P, y); x.letterSpacing = '0px'; y += 48;
                }
                function cellFont(cell) {
                    return cell.cls === 'g' ? 'bold 40px ' + F : cell.cls === 'm' ? '34px ui-monospace, Menlo, Consolas, monospace' : '34px ' + F;
                }
                function drawGrid(cells) {
                    if (!cells.length) return;
                    var pad = 34, gap = 40, colW = (IW - 2 * pad - gap) / 2, rows = [];
                    for (var i = 0; i < cells.length; i += 2) rows.push(cells.slice(i, i + 2));
                    var hs = rows.map(function(row) {
                        return Math.max.apply(null, row.map(function(cl) { x.font = cellFont(cl); cl.lines = wrapLines(x, cl.val, colW); return 34 + cl.lines.length * 46; }));
                    });
                    var boxH = 2 * pad + hs.reduce(function(a, b) { return a + b; }, 0) + (rows.length - 1) * 30;
                    boxBg(boxH);
                    var cy = y + pad;
                    rows.forEach(function(row, ri) {
                        row.forEach(function(cl, ci) {
                            var cx = P + pad + ci * (colW + gap);
                            x.font = 'bold 22px ' + F; x.letterSpacing = '2px'; x.fillStyle = '#94a3b8';
                            x.fillText(cl.label.toUpperCase(), cx, cy); x.letterSpacing = '0px';
                            x.font = cellFont(cl); x.fillStyle = cl.cls === 'g' ? '#34d399' : '#e2e8f0';
                            cl.lines.forEach(function(ln, li) { x.fillText(ln, cx, cy + 34 + li * 46); });
                        });
                        cy += hs[ri] + 30;
                    });
                    y += boxH + 24;
                }

                if (loaded.length) {
                    var cv = loaded[0], sc = Math.min(IW / cv.width, 520 / cv.height), dw = cv.width * sc, dh = cv.height * sc;
                    drawImg(cv, (W - dw) / 2, y, dw, dh, 36); y += dh + 16;
                    var H = 200, gp = 16, rows2 = [], cur = [], curW = 0;
                    loaded.slice(1).forEach(function(im) {
                        var w2 = im.width * H / im.height, add = (cur.length ? gp : 0) + w2;
                        if (cur.length && curW + add > IW) { rows2.push(cur); cur = []; curW = 0; add = w2; }
                        cur.push({ im: im, w: w2 }); curW += add;
                    });
                    if (cur.length) rows2.push(cur);
                    rows2.forEach(function(row) {
                        var rw = row.reduce(function(a, b) { return a + b.w; }, 0) + gp * (row.length - 1), px = (W - rw) / 2;
                        row.forEach(function(it) { drawImg(it.im, px, y, it.w, H, 16); px += it.w + gp; });
                        y += H + gp;
                    });
                    y += 8;
                }
                if (m.title) {
                    x.font = 'bold 56px ' + F; x.fillStyle = '#ffffff';
                    wrapLines(x, m.title, IW).forEach(function(ln) { x.fillText(ln, P, y); y += 68; });
                    y += 10;
                }
                drawGrid(m.top);
                if (m.specs.length) { y += 12; heading('Additional Specifications'); drawGrid(m.specs); }
                if (m.notes) {
                    y += 12; heading('Notes');
                    x.font = '34px ' + F;
                    var nl = wrapLines(x, m.notes, IW - 68), nh = 68 + nl.length * 46;
                    boxBg(nh); x.fillStyle = '#e2e8f0';
                    nl.forEach(function(ln, i) { x.fillText(ln, P + 34, y + 34 + i * 46); });
                    y += nh + 24;
                }
                x.font = '22px ' + F; x.fillStyle = '#475569'; x.textAlign = 'center';
                x.fillText('Watch Vault \u00b7 ' + new Date().toLocaleDateString(), W / 2, y + 8);
                y += 60;
                var out = document.createElement('canvas');
                out.width = W; out.height = Math.min(y, 8000);
                out.getContext('2d').drawImage(c, 0, 0, W, out.height, 0, 0, W, out.height);
                var blob = await new Promise(function(res) { out.toBlob(res, 'image/png'); });
                return blob ? new File([blob], 'watch-report.png', { type: 'image/png' }) : null;
            } catch (e) { console.error(e); return null; }
        }
